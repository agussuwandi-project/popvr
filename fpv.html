function glass(ctx, W, H, accent, rad = 40) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(38,34,78,.82)'); g.addColorStop(1, 'rgba(8,12,30,.82)');
  ctx.fillStyle = g; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.fill();
  ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 24; ctx.strokeStyle = accent; ctx.lineWidth = 5; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.stroke(); ctx.restore();
  const hl = ctx.createLinearGradient(0, 0, 0, H * .45); hl.addColorStop(0, 'rgba(255,255,255,.14)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; rr(ctx, 14, 14, W - 28, H * .42, Math.max(8, rad - 8)); ctx.fill();
}
const __pops = [];
function popup(pos, text, color = '#ffffff', size = .3) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  x.font = `700 84px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 10; x.strokeStyle = 'rgba(0,0,0,.55)'; x.strokeText(text, 256, 64); x.fillStyle = color; x.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.position.copy(pos); s.scale.set(size, size / 4, 1); s.renderOrder = 998; scene.add(s); __pops.push({ s, tex, t0: performance.now() });
}
function updatePopups() {
  const now = performance.now();
  for (let i = __pops.length - 1; i >= 0; i--) { const p = __pops[i], k = (now - p.t0) / 900;
    p.s.position.y += 0.004; p.s.material.opacity = Math.max(0, 1 - k * k);
    if (k >= 1) { scene.remove(p.s); p.tex.dispose(); p.s.material.dispose(); __pops.splice(i, 1); } }
}



const R = THREE.MathUtils;
let seed = SEED; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const scene = new THREE.Scene();

// ---------- Robot & kokpit (rig) ----------
const robot = new THREE.Group(); scene.add(robot);         // badan robot di lantai
const CAM_H = 1.05;                                        // tinggi kamera robot dari lantai

import('./logo3d.js').then(m => m.pasangLogo3D(renderer, scene)).catch(e => console.warn('logo3d', e));

// ---------- Dunia reruntuhan ----------
const ARENA = 34;
const solids = [];   // rintangan 2D: {x,z,hx,hz,a} (kotak berputar)
const losMeshes = []; // untuk cek garis pandang
const heatObjs = [];  // {mesh, heat}
const allMeshes = []; // untuk tampilan termal
function reg(mesh, heat = 0.12, solid = true, los = true) {
  mesh.userData.heat = heat; allMeshes.push(mesh); if (los) losMeshes.push(mesh); scene.add(mesh); return mesh;
}
function solidBox(x, z, w, d, a = 0) { solids.push({ x, z, hx: w / 2, hz: d / 2, a }); }
const M = {
  beton: new THREE.MeshStandardMaterial({ color: 0x9a9184, roughness: .95 }),
  beton2: new THREE.MeshStandardMaterial({ color: 0x7d746a, roughness: .95 }),
  bata: new THREE.MeshStandardMaterial({ color: 0x9c5a44, roughness: .9 }),
  besi: new THREE.MeshStandardMaterial({ color: 0x4a3a30, metalness: .6, roughness: .6 }),
  tanah: new THREE.MeshStandardMaterial({ color: 0x6e6052, roughness: 1 }),
};
scene.add(new THREE.HemisphereLight(0xfff0dd, 0x3a3028, 1.5));
const sun = new THREE.DirectionalLight(0xffe2b8, 1.6); sun.position.set(8, 14, 5); scene.add(sun);
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(ARENA + 20, ARENA + 20), M.tanah); g.rotation.x = -Math.PI / 2; reg(g, 0.1, false, false);
  // pagar batas
  const tapeM = new THREE.MeshBasicMaterial({ color: 0xffd23f });
  for (const [x, z, w, d] of [[0, -ARENA / 2, ARENA, .3], [0, ARENA / 2, ARENA, .3], [-ARENA / 2, 0, .3, ARENA], [ARENA / 2, 0, .3, ARENA]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.2, d), M.beton2); m.position.set(x, .6, z); reg(m); solidBox(x, z, w, d);
    const t = new THREE.Mesh(new THREE.BoxGeometry(w + .02, .08, d + .02), tapeM); t.position.set(x, 1.0, z); reg(t, .1, false, false);
  }
}
// bangunan runtuh: dinding patah, pelat miring, kolom, tumpukan puing
const area = []; // area terpakai
const bebas = (x, z, r) => Math.hypot(x, z) > 3.2 && area.every(a => Math.hypot(a[0] - x, a[1] - z) > a[2] + r);
function cariTempat(r, tries = 400) { for (let i = 0; i < tries; i++) { const x = (rnd() - .5) * (ARENA - 4), z = (rnd() - .5) * (ARENA - 4); if (bebas(x, z, r)) return [x, z]; } return null; }
function dinding(x, z, w, a) {
  const h = 1.4 + rnd() * 1.8, g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = a;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, .25), rnd() < .5 ? M.bata : M.beton); m.position.y = h / 2; m.rotation.z = (rnd() - .5) * .12; g.add(m);
  // tepi patah
  for (let i = 0; i < 4; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(.3 + rnd() * .5, .3 + rnd() * .5, .26), m.material); c.position.set((rnd() - .5) * w, h + rnd() * .2 - .1, 0); c.rotation.z = rnd() * 1.5; g.add(c); }
  scene.add(g); g.traverse(o => { if (o.isMesh) { o.userData.heat = 0.12; allMeshes.push(o); losMeshes.push(o); } });
  solidBox(x, z, w, .45, a); area.push([x, z, w / 2 + .3]);
}
function pelat(x, z) {
  const w = 2.5 + rnd() * 2, d = 1.8 + rnd() * 1.5, a = rnd() * Math.PI, tilt = .25 + rnd() * .35;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, .22, d), M.beton); m.position.set(x, Math.sin(tilt) * d / 2 + .05, z); m.rotation.set(tilt, a, 0, 'YXZ'); reg(m);
  for (let i = 0; i < 5; i++) { // besi beton mencuat
    const r = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .5 + rnd() * .6, 5), M.besi);
    r.position.set(x + (rnd() - .5) * w * .8, .3 + rnd() * .6, z + (rnd() - .5) * d * .5); r.rotation.set(rnd() - .5, 0, rnd() - .5); reg(r, .1, false, false);
  }
  solidBox(x, z, w, d * Math.cos(tilt), a); area.push([x, z, Math.max(w, d) / 2 + .3]);
}
function kolom(x, z) {
  const h = 2 + rnd() * 2.5, m = new THREE.Mesh(new THREE.BoxGeometry(.45, h, .45), M.beton2); m.position.set(x, h / 2, z); m.rotation.set((rnd() - .5) * .2, rnd(), (rnd() - .5) * .2); reg(m);
  solidBox(x, z, .55, .55, m.rotation.y); area.push([x, z, .6]);
}
function puing(x, z) {
  const r = .8 + rnd() * .8, n = 8 + Math.floor(rnd() * 8);
  for (let i = 0; i < n; i++) {
    const s = .2 + rnd() * .5, m = new THREE.Mesh(new THREE.BoxGeometry(s, s * .6, s * (.6 + rnd())), rnd() < .4 ? M.bata : M.beton2);
    const aa = rnd() * 6.28, rr = rnd() * r; m.position.set(x + Math.cos(aa) * rr, s * .3 + (1 - rr / r) * .35, z + Math.sin(aa) * rr); m.rotation.set(rnd(), rnd() * 3, rnd()); reg(m);
  }
  solids.push({ x, z, hx: r * .75, hz: r * .75, a: 0, round: true }); area.push([x, z, r + .3]);
}
for (let i = 0; i < 16; i++) { const p = cariTempat(2); if (p) dinding(p[0], p[1], 2.5 + rnd() * 3, rnd() * Math.PI); }
for (let i = 0; i < 9; i++) { const p = cariTempat(2.2); if (p) pelat(p[0], p[1]); }
for (let i = 0; i < 12; i++) { const p = cariTempat(.8); if (p) kolom(p[0], p[1]); }
for (let i = 0; i < 12; i++) { const p = cariTempat(1.4); if (p) puing(p[0], p[1]); }
// kerikil kecil (instanced, tanpa tabrakan)
{
  const geo = new THREE.DodecahedronGeometry(.08, 0), im = new THREE.InstancedMesh(geo, M.beton2, 900), d = new THREE.Object3D();
  for (let i = 0; i < 900; i++) { d.position.set((rnd() - .5) * ARENA, .03, (rnd() - .5) * ARENA); d.rotation.set(rnd() * 3, rnd() * 3, 0); d.scale.setScalar(.4 + rnd() * 1.4); d.updateMatrix(); im.setMatrixAt(i, d.matrix); }
  reg(im, .1, false, false);
}
// debu melayang
const dust = (() => {
  const n = 500, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - .5) * 20; pos[i * 3 + 1] = rnd() * 3; pos[i * 3 + 2] = (rnd() - .5) * 20; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xd8c8b0, size: .025, transparent: true, opacity: .55, depthWrite: false })); scene.add(p); return p;
})();

// ---------- Korban & sumber panas palsu ----------
const targets = []; // {kind:'korban'|'api'|'mesin', pos, found, mesh}
const kulit = [0xc68e6a, 0xa8714f, 0x8d5a3c, 0xe0ac86], baju = [0x3b5b8a, 0x8a3b3b, 0x4a6a3b, 0x6a5a8a, 0x8a7a3b];
function korban(x, z, i) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rnd() * 6.28;
  const kM = new THREE.MeshStandardMaterial({ color: kulit[i % 4], roughness: .8 }), bM = new THREE.MeshStandardMaterial({ color: baju[i % 5], roughness: .9 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.16, .5, 4, 10), bM); body.rotation.z = Math.PI / 2; body.position.y = .17; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.12, 14, 10), kM); head.position.set(.48, .17, 0); g.add(head);
  const legs = new THREE.Mesh(new THREE.CapsuleGeometry(.1, .55, 4, 8), new THREE.MeshStandardMaterial({ color: 0x2a2a35 })); legs.rotation.z = Math.PI / 2; legs.position.set(-.55, .12, .07); g.add(legs);
  const arm = new THREE.Group(); arm.position.set(.25, .25, .14); g.add(arm);
  const armM = new THREE.Mesh(new THREE.CapsuleGeometry(.05, .4, 4, 8), kM); armM.position.y = .22; arm.add(armM); arm.rotation.x = -0.5;
  // tertimpa pelat kecil
  const slab = new THREE.Mesh(new THREE.BoxGeometry(.9, .14, .8), M.beton); slab.position.set(-.5, .32, 0); slab.rotation.z = .25; g.add(slab);
  scene.add(g);
  g.traverse(o => { if (o.isMesh) { o.userData.heat = o === slab ? 0.2 : 0.88; allMeshes.push(o); } });
  solids.push({ x, z, hx: .55, hz: .55, a: 0, round: true }); area.push([x, z, 1.2]);
  targets.push({ kind: 'korban', pos: new THREE.Vector3(x, .25, z), found: false, wrong: false, mesh: g, arm, phase: rnd() * 6 });
}
const flameTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 40, 2, 32, 36, 30);
  g.addColorStop(0, 'rgba(255,250,200,1)'); g.addColorStop(.35, 'rgba(255,170,40,.9)'); g.addColorStop(1, 'rgba(255,60,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const flames = [];
function api(x, z) {
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .8, 16), new THREE.MeshStandardMaterial({ color: 0x5a2a1a, metalness: .5, roughness: .6 }));
  drum.position.set(x, .4, z); reg(drum, 0.97);
  for (let i = 0; i < 3; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    s.position.set(x + (rnd() - .5) * .2, .95 + i * .15, z + (rnd() - .5) * .2); s.scale.set(.6, .8, 1); scene.add(s); flames.push({ s, ph: rnd() * 6, base: s.position.y }); }
  solidBox(x, z, .7, .7); area.push([x, z, 1]);
  targets.push({ kind: 'api', pos: new THREE.Vector3(x, .6, z), found: false, mesh: drum });
}
function mesin(x, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, .7, .6), new THREE.MeshStandardMaterial({ color: 0xc8a020, metalness: .4, roughness: .5 }));
  m.position.set(x, .35, z); m.rotation.y = rnd() * 3; reg(m, 0.72);
  solidBox(x, z, 1.1, .7, m.rotation.y); area.push([x, z, .9]);
  targets.push({ kind: 'mesin', pos: new THREE.Vector3(x, .5, z), found: false, mesh: m });
}
for (let i = 0; i < N_KORBAN; i++) { const p = cariTempat(1.3, 2000); if (p) korban(p[0], p[1], i); }
for (let i = 0; i < 2; i++) { const p = cariTempat(1.1, 2000); if (p) api(p[0], p[1]); }
{ const p = cariTempat(1, 2000); if (p) mesin(p[0], p[1]); }

// ---------- Badan robot (yang terlihat dari kokpit) ----------
{
  const bodyM = new THREE.MeshStandardMaterial({ color: 0xff7a2a, roughness: .5, metalness: .2 });
  const darkM = new THREE.MeshStandardMaterial({ color: 0x22252d, roughness: .7 });
  const hull = new THREE.Mesh(new THREE.BoxGeometry(.7, .22, 1.0), bodyM); hull.position.set(0, .32, .1); robot.add(hull);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(.6, .12, .3), bodyM); nose.position.set(0, .3, -.48); nose.rotation.x = .4; robot.add(nose);
  for (const s of [-1, 1]) { const tr = new THREE.Mesh(new THREE.BoxGeometry(.16, .26, 1.15), darkM); tr.position.set(s * .43, .14, .1); robot.add(tr);
    for (let i = 0; i < 9; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(.17, .03, .05), M.besi); c.position.set(s * .43, .275, -.45 + i * .13); robot.add(c); } }
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, CAM_H - .5, 8), darkM); mast.position.set(0, (CAM_H + .5) / 2 - .1, .25); robot.add(mast);
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(.5, .05, .05), new THREE.MeshBasicMaterial({ color: 0xfff4d0 })); lamp.position.set(0, .45, -.45); robot.add(lamp);
}
robot.children.forEach(o => { if (o.isMesh) { o.userData.heat = .3; allMeshes.push(o); } });
const headlight = new THREE.SpotLight(0xfff0d0, 25, 14, .55, .5, 1.6); headlight.position.set(0, .5, -.4); robot.add(headlight); headlight.target.position.set(0, 0, -6); robot.add(headlight.target);

// ---------- Kamera termal (render ke tekstur) ----------
const TW = 384, TH = 216;
const thermalRT = new THREE.WebGLRenderTarget(TW, TH);
const thermalCam = new THREE.PerspectiveCamera(48, TW / TH, .05, 40); thermalCam.position.set(0, .55, -.45); thermalCam.rotation.x = -.14; robot.add(thermalCam);
const thermMats = new Map();
function warnaPanas(h) { // palet "ironbow": dingin ungu tua → oranye → kuning-putih
  const stops = [[0, [10, 8, 40]], [.25, [70, 20, 110]], [.5, [190, 40, 90]], [.7, [240, 110, 30]], [.85, [255, 200, 40]], [1, [255, 255, 230]]];
  for (let i = 1; i < stops.length; i++) if (h <= stops[i][0]) { const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (h - a) / (b - a); return new THREE.Color(...ca.map((v, k) => (v + (cb[k] - v) * t) / 255)); }
  return new THREE.Color(1, 1, .9);
}
function thermMat(h) { const k = Math.round(h * 20); if (!thermMats.has(k)) thermMats.set(k, new THREE.MeshBasicMaterial({ color: warnaPanas(k / 20) })); return thermMats.get(k); }
const thermFog = new THREE.Fog(0x0a0828, 3, 22), thermBg = new THREE.Color(0x0a0828);
let thermT = 0, thermalOn = true;
function renderTermal() {
  const xr = renderer.xr.enabled; renderer.xr.enabled = false;
  const fog = scene.fog, bg = scene.background; scene.fog = thermFog; scene.background = thermBg;
  for (const m of allMeshes) { m.userData.mat = m.material; m.material = thermMat(m.userData.heat ?? .1); }
  const hide = [dust, ...flames.map(f => f.s), cockpit, hud]; const vis = hide.map(o => o.visible); hide.forEach(o => o.visible = false);
  renderer.setRenderTarget(thermalRT); renderer.render(scene, thermalCam); renderer.setRenderTarget(null);
  hide.forEach((o, i) => o.visible = vis[i]);
  for (const m of allMeshes) m.material = m.userData.mat;

  if (motorGain) { const load = Math.abs(S.v) / VMAX + Math.abs(S.w) / WMAX * .5; motorGain.gain.setTargetAtTime(Math.min(.09, load * .07), ac.currentTime, .05); motor.frequency.setTargetAtTime(48 + load * 50, ac.currentTime, .05); }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) hint.mesh.visible = false; }
  thermT += dt; if (thermT > 1 / 15) { thermT = 0; renderTermal(); }
  petaT += dt; if (petaT > .2) { petaT = 0; gambarPeta(); gambarStatus(); }
  updatePopups();
  renderer.render(scene, camera);
});

// kait uji
window.__fpv = {
  S, targets: () => targets.map(t => ({ kind: t.kind, x: +t.pos.x.toFixed(2), z: +t.pos.z.toFixed(2), found: t.found })),
  jalan(thr, st, detik) { const n = Math.round(detik / .02); for (let i = 0; i < n; i++) langkah(thr, st, .02); return { x: S.x, z: S.z, h: S.h }; },
  taruh(x, z, h) { S.x = x; S.z = z; S.h = h; S.v = S.w = 0; dorongKeluar(); return { x: S.x, z: S.z }; },
  hadap(t) { const tg = targets[t]; S.h = Math.atan2(-(tg.pos.x - S.x), -(tg.pos.z - S.z)); },
  tandai, solids: () => solids.length, termal: () => { renderTermal(); const buf = new Uint8Array(TW * TH * 4); renderer.readRenderTargetPixels(thermalRT, 0, 0, TW, TH, buf); return buf; },
  tembus: (x, z) => { const sx = S.x, sz = S.z; S.x = x; S.z = z; dorongKeluar(); const d = Math.hypot(S.x - x, S.z - z); S.x = sx; S.z = sz; return d; },
  bebasDi: (x, z) => { const sx = S.x, sz = S.z; S.x = x; S.z = z; const k = dorongKeluar(); const r = !k; S.x = sx; S.z = sz; return r; },
};
