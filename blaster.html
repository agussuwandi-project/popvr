<script type="module">
import * as THREE from 'three';

// ====== PENGATURAN (silakan ubah) ======
const EVENT_NAME = 'Pameran Kampus UVERS';
const DURATION = 75;      // detik per ronde
const LIVES = 3;          // nyawa
const ENEMY = {
  drone: { hp: 1, pts: 10, r: 0.55, speed: [1.8, 3.0] },
  fast:  { hp: 1, pts: 20, r: 0.45, speed: [3.2, 4.6] },
  tank:  { hp: 3, pts: 40, r: 0.75, speed: [1.1, 1.7] },
  ufo:   { hp: 1, pts: 75, r: 0.85, speed: [3.0, 3.0] },
};
// =======================================

// ---------- Gaya visual bersama (font, panel kaca, angka melayang) ----------
await Promise.race([document.fonts.load("700 40px 'Space Grotesk'"), new Promise(r => setTimeout(r, 1500))]).catch(() => {});
const FONT = "'Space Grotesk', system-ui, sans-serif";
function glass(ctx, W, H, accent, rad = 40) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(38,34,78,.82)'); g.addColorStop(1, 'rgba(8,12,30,.82)');
  ctx.fillStyle = g; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.fill();
  ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 24; ctx.strokeStyle = accent; ctx.lineWidth = 5; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.stroke(); ctx.restore();
  const hl = ctx.createLinearGradient(0, 0, 0, H * .45); hl.addColorStop(0, 'rgba(255,255,255,.14)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; rr(ctx, 14, 14, W - 28, H * .42, Math.max(8, rad - 8)); ctx.fill();
}
const __pops = [];
function popup(pos, text, color = '#ffffff', size = .3) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  x.font = `700 84px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 10; x.strokeStyle = 'rgba(0,0,0,.55)'; x.strokeText(text, 256, 64); x.fillStyle = color; x.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.position.copy(pos); s.scale.set(size, size / 4, 1); s.renderOrder = 998; scene.add(s); __pops.push({ s, tex, t0: performance.now() });
}
function updatePopups() {
  const now = performance.now();
  for (let i = __pops.length - 1; i >= 0; i--) { const p = __pops[i], k = (now - p.t0) / 900;
    p.s.position.y += 0.004; p.s.material.opacity = Math.max(0, 1 - k * k);
    if (k >= 1) { scene.remove(p.s); p.tex.dispose(); p.s.material.dispose(); __pops.splice(i, 1); } }
}

const R = THREE.MathUtils;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
// ---- tombol Masuk VR (menggantikan VRButton bawaan agar senada dengan tema)
{
  const ov = document.getElementById('ov'), msg = document.getElementById('msg'), btnVR = document.getElementById('btnVR');
  const laptop = 'Mode tes laptop: klik target hijau untuk mulai, klik musuh untuk menembak.';
  (async () => {
    if (!navigator.xr) { msg.textContent = 'WebXR tidak tersedia. ' + laptop; return; }
    const ok = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
    btnVR.disabled = !ok;
    msg.textContent = ok ? 'Siap! Tekan Masuk VR, lalu pakai headset.' : 'Headset tidak terdeteksi. ' + laptop;
  })();
  btnVR.onclick = async () => {
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers'] });
      s.addEventListener('end', () => ov.classList.remove('hide'));
      await renderer.xr.setSession(s); ov.classList.add('hide');
    } catch (e) { msg.textContent = 'Gagal memulai: ' + e.message; }
  };
}

const scene = new THREE.Scene();
import('./logo3d.js').then(m => m.pasangLogo3D(renderer, scene)).catch(e => console.warn('logo3d', e));
const BG = new THREE.Color(0x05060f);
scene.background = BG.clone();
scene.fog = new THREE.Fog(0x05060f, 18, 60);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.03, 200);
camera.position.set(0, 1.6, 0.5);
scene.add(camera);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Lingkungan ----------
scene.add(new THREE.HemisphereLight(0x8899ff, 0x221133, 1.2));
const sun = new THREE.DirectionalLight(0xffeedd, 1.8); sun.position.set(-3, 6, 2); scene.add(sun);
{ // lantai platform
  const grid = new THREE.GridHelper(40, 80, 0x6633ff, 0x221155); scene.add(grid);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.3, 0.05, 48),
    new THREE.MeshStandardMaterial({ color: 0x141a3a, emissive: 0x0a0f2a, metalness: .6, roughness: .4 }));
  pad.position.y = 0.025; scene.add(pad);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.02, 8, 64), new THREE.MeshBasicMaterial({ color: 0x44ccff }));
  edge.rotation.x = Math.PI / 2; edge.position.y = 0.06; scene.add(edge);
}
{ // bintang
  const n = 1500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) new THREE.Vector3().randomDirection().multiplyScalar(R.randFloat(80, 120)).toArray(p, i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, fog: false })));
}
const planet = new THREE.Group(); planet.position.set(25, 18, -70); scene.add(planet);
planet.add(new THREE.Mesh(new THREE.SphereGeometry(12, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0x6a3cff, emissive: 0x2a1060, roughness: .9, fog: false })));
{ const ringP = new THREE.Mesh(new THREE.RingGeometry(15, 21, 96),
    new THREE.MeshBasicMaterial({ color: 0xc8a0ff, transparent: true, opacity: .35, side: THREE.DoubleSide, fog: false }));
  ringP.rotation.x = -1.2; ringP.rotation.y = .3; planet.add(ringP); }
const moon = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 16), new THREE.MeshStandardMaterial({ color: 0x88aacc, fog: false }));
moon.position.set(-40, 10, -60); scene.add(moon);

// ---------- Panel teks ----------
function makePanel(w, h, cw, ch) {
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, fog: false }));
  return { mesh, ctx, tex, c };
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const board = makePanel(2.8, 1.1, 1280, 504);
board.mesh.position.set(0, 3.7, -5); board.mesh.lookAt(0, 1.6, 0); scene.add(board.mesh);

// ---------- Target mulai ----------
const startT = new THREE.Group(); startT.position.set(0, 1.6, -3.2); scene.add(startT);
for (let i = 0; i < 3; i++) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.35 - i * 0.11, 0.035, 8, 48),
    new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffffff : 0x33ff77 }));
  startT.add(m);
}
startT.add(new THREE.Mesh(new THREE.CircleGeometry(0.06, 24), new THREE.MeshBasicMaterial({ color: 0xff3355 })));
const startHit = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
startHit.userData.isStart = true; startT.add(startHit);
const startLabel = makePanel(1.2, 0.2, 768, 128);
startLabel.mesh.position.set(0, 0.6, 0); startT.add(startLabel.mesh);
{ const { ctx, c } = startLabel; glass(ctx, c.width, c.height, 'rgba(125,255,160,.85)', 30);
  ctx.fillStyle = '#7dffa0'; ctx.font = `bold 56px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('TEMBAK UNTUK MULAI', c.width / 2, c.height / 2 + 4); startLabel.tex.needsUpdate = true; }


// ---------- Tombol KELUAR (tembak untuk keluar dari VR/MR) ----------
const exitT = new THREE.Group(); scene.add(exitT);
exitT.add(new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.022, 8, 40), new THREE.MeshBasicMaterial({ color: 0xff4466 })));
{ const x1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 0.01), new THREE.MeshBasicMaterial({ color: 0xffffff })); x1.rotation.z = Math.PI / 4;
  const x2 = x1.clone(); x2.rotation.z = -Math.PI / 4; exitT.add(x1, x2); }
const exitHit = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 8), new THREE.MeshBasicMaterial({ visible: false }));
exitHit.userData.isExit = true; exitHit.userData.kind = 'exit'; exitT.add(exitHit);
const exitLabel = makePanel(0.42, 0.1, 384, 96); exitLabel.mesh.position.y = 0.26; exitT.add(exitLabel.mesh);
{ const { ctx, c } = exitLabel; glass(ctx, c.width, c.height, 'rgba(255,90,120,.9)', 26);
  ctx.fillStyle = '#fff'; ctx.font = `700 44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('KELUAR', c.width / 2, c.height / 2 + 3); exitLabel.tex.needsUpdate = true; }
function exitXR() { try { renderer.xr.getSession()?.end(); } catch (e) {} }

// ---------- Suara ----------
let ac = null, noiseBuf = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) {} }
  ac?.resume?.();
}
function tone(f, d, type = 'sine', vol = .2, ramp = 1) {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f * ramp), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function boom(vol = .5, dur = .5, freq = 900) {
  if (!ac || !noiseBuf) return; const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  laser: () => tone(1400, .13, 'square', .08, .15),
  hit:   () => tone(500, .08, 'triangle', .2, 2),
  kill:  () => { boom(.45, .45, 1400); tone(220, .2, 'sawtooth', .08, .4); },
  hurt:  () => { boom(.7, .7, 400); tone(110, .5, 'sawtooth', .2, .5); },
  bonus: () => { [880, 1100, 1320, 1760].forEach((f, i) => setTimeout(() => tone(f, .12, 'triangle', .18), i * 60)); },
  start: () => { [440, 660, 880].forEach((f, i) => setTimeout(() => tone(f, .12, 'square', .12), i * 110)); },
  over:  () => { [660, 520, 400, 260].forEach((f, i) => setTimeout(() => tone(f, .25, 'triangle', .2), i * 160)); },
};
addEventListener('pointerdown', initAudio); addEventListener('click', initAudio, true);
renderer.xr.addEventListener('sessionstart', initAudio);

// ---------- Efek: kilatan laser, ledakan, kilat merah ----------
const beams = [];
function beam(from, to, color) {
  const g = new THREE.BufferGeometry().setFromPoints([from, to]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, fog: false }));
  l.userData.t = 0; scene.add(l); beams.push(l);
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({ color, transparent: true }));
  s.position.copy(to); s.userData.t = 0; scene.add(s); beams.push(s);
}
const parts = [], pGeo = new THREE.BoxGeometry(1, 1, 1);
function explode(pos, color, n = 26, size = 0.07, spd = 4) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pGeo, mat); p.position.copy(pos); p.scale.setScalar(size * R.randFloat(.5, 1.3));
    p.userData = { v: new THREE.Vector3().randomDirection().multiplyScalar(R.randFloat(.3, 1) * spd), t: 0, life: R.randFloat(.5, .9), spin: R.randFloat(-8, 8) };
    scene.add(p); parts.push(p);
  }
  const flash = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .9 }));
  flash.position.copy(pos); flash.scale.setScalar(.2); flash.userData = { flash: true, t: 0, life: .25 }; scene.add(flash); parts.push(flash);
}
const hurtSphere = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xff0022, transparent: true, opacity: 0, side: THREE.BackSide, depthTest: false }));
hurtSphere.renderOrder = 999; camera.add(hurtSphere);
let hurtT = 0;

// ---------- Musuh ----------
const enemies = [], hitboxes = [];
function emi(color, extra = {}) { return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .5, roughness: .35, metalness: .3, ...extra }); }
function makeEnemy(type) {
  const g = new THREE.Group(); const parts = [];
  if (type === 'drone') {
    const body = new THREE.Mesh(new THREE.OctahedronGeometry(0.25, 0), emi(0xff33cc, { flatShading: true }));
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.03, 8, 32), emi(0x33e0ff));
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffaa }));
    eye.position.z = 0.2; g.add(body, ring, eye); parts.push(ring); g.userData.spinPart = ring;
  } else if (type === 'fast') {
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.55, 6), emi(0x55ff66, { flatShading: true }));
    body.rotation.x = Math.PI / 2; g.add(body);
    for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.18), emi(0x22aa44)); w.position.set(s * 0.18, 0, -0.1); g.add(w); }
  } else if (type === 'tank') {
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), emi(0xff8833, { flatShading: true }));
    g.add(body);
    for (let i = 0; i < 8; i++) {
      const sp = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.25, 6), emi(0xffdd55));
      const d = new THREE.Vector3().randomDirection(); sp.position.copy(d).multiplyScalar(0.45);
      sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d); g.add(sp);
    }
    g.userData.spinPart = body;
  } else { // ufo
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.85, 0.16, 32), emi(0xffcc33, { metalness: .8 }));
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), emi(0x88ffff, { transparent: true, opacity: .8 }));
    dome.position.y = 0.08; g.add(disc, dome);
    for (let i = 0; i < 8; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshBasicMaterial({ color: i % 2 ? 0xff3355 : 0x33ff77 }));
      const a = i / 8 * Math.PI * 2; l.position.set(Math.cos(a) * 0.78, -0.02, Math.sin(a) * 0.78); disc.add(l); }
    g.userData.spinPart = disc;
  }
  const hb = new THREE.Mesh(new THREE.SphereGeometry(ENEMY[type].r, 10, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hb.userData.enemy = g; g.add(hb);
  g.userData = { ...g.userData, type, hp: ENEMY[type].hp, hb, t: 0, phase: Math.random() * 10 };
  return g;
}
const head = new THREE.Vector3();
function spawn(type) {
  const prog = Math.min(1, elapsed / DURATION), e = makeEnemy(type), cfg = ENEMY[type];
  if (type === 'ufo') {
    const side = Math.random() < .5 ? -1 : 1;
    e.position.set(-side * 14, R.randFloat(3, 4), -R.randFloat(8, 11));
    e.userData.vel = new THREE.Vector3(side * cfg.speed[0], 0, 0);
  } else {
    const a = R.degToRad(R.randFloat(-55, 55)), d = R.randFloat(15, 18);
    e.position.set(head.x + Math.sin(a) * d, R.randFloat(0.9, 3.0), head.z - Math.cos(a) * d);
    e.userData.speed = R.lerp(cfg.speed[0], cfg.speed[1], prog);
  }
  scene.add(e); enemies.push(e); hitboxes.push(e.userData.hb);
}
function removeEnemy(e) {
  scene.remove(e); enemies.splice(enemies.indexOf(e), 1); hitboxes.splice(hitboxes.indexOf(e.userData.hb), 1);
}

// ---------- State ----------
let state = 'idle', score = 0, elapsed = 0, lives = LIVES, streak = 0, kills = 0, shots = 0, hits = 0;
let spawnT = 0, ufoT = 12, canStart = true, newRecord = false;
let best = 0; try { best = +localStorage.getItem('blaster_best') || 0; } catch (e) {}
const mult = () => Math.min(4, 1 + Math.floor(streak / 5));
let lastKey = '';
function drawBoard() {
  const remain = Math.max(0, Math.ceil(DURATION - elapsed));
  const key = [state, score, remain, lives, mult(), best].join('|'); if (key === lastKey) return; lastKey = key;
  const { ctx, c } = board, W = c.width; ctx.clearRect(0, 0, W, c.height);
  glass(ctx, W, c.height, 'rgba(170,120,255,.9)');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#b9a6ff'; ctx.font = `34px ${FONT}`; ctx.fillText(EVENT_NAME + ' · GALAKSI BLASTER', W / 2, 50);
  if (state === 'playing') {
    ctx.font = `40px ${FONT}`; ctx.fillStyle = '#9fd8ff';
    ctx.fillText('SKOR', W / 2, 115); ctx.fillText('WAKTU', 210, 115); ctx.fillText('NYAWA', W - 210, 115);
    ctx.fillStyle = '#fff'; ctx.font = `bold 140px ${FONT}`; ctx.fillText(score, W / 2, 230);
    ctx.fillStyle = remain <= 10 ? '#ff5577' : '#7dffa0'; ctx.font = `bold 100px ${FONT}`; ctx.fillText(remain, 210, 230);
    ctx.font = `84px ${FONT}`; ctx.fillStyle = '#ff4466';
    ctx.fillText('♥'.repeat(lives) + '♡'.repeat(LIVES - lives), W - 210, 230);
    const m = mult();
    ctx.font = `bold 64px ${FONT}`; ctx.fillStyle = m > 1 ? ['#fff', '#fff', '#7dffa0', '#ffcc33', '#ff66ff'][m] : 'rgba(255,255,255,.35)';
    ctx.fillText(m > 1 ? `COMBO x${m}` : 'tembak beruntun = combo', W / 2, 360);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(140, 430, W - 280, 24);
    ctx.fillStyle = remain <= 10 ? '#ff5577' : '#a066ff'; ctx.fillRect(140, 430, (W - 280) * remain / DURATION, 24);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = `bold 96px ${FONT}`;
    ctx.fillText(state === 'over' ? 'SKOR: ' + score : 'GALAKSI BLASTER', W / 2, 140);
    ctx.font = `40px ${FONT}`;
    if (state === 'over') {
      ctx.fillStyle = newRecord ? '#ffcc33' : '#9fd8ff';
      const acc = shots ? Math.round(hits / shots * 100) : 0;
      ctx.fillText((newRecord ? '★ REKOR BARU! ★   ' : 'Rekor: ' + best + '   ') + `Musuh: ${kills}   Akurasi: ${acc}%`, W / 2, 225);
    } else { ctx.fillStyle = '#9fd8ff'; ctx.fillText('Rekor hari ini: ' + best, W / 2, 225); }
    ctx.font = `32px ${FONT}`;
    ctx.fillStyle = '#ff66dd'; ctx.fillText('Drone 10', W * .14, 295);
    ctx.fillStyle = '#66ff77'; ctx.fillText('Pesawat cepat 20', W * .38, 295);
    ctx.fillStyle = '#ffaa44'; ctx.fillText('Raksasa (3x) 40', W * .63, 295);
    ctx.fillStyle = '#ffcc33'; ctx.fillText('UFO 75', W * .86, 295);
    ctx.fillStyle = '#fff'; ctx.font = `36px ${FONT}`;
    ctx.fillText('Tembak: tarik TRIGGER  /  cubit (pinch) jari', W / 2, 350);
    ctx.fillText('Jangan biarkan musuh menabrakmu!', W / 2, 398);
    ctx.fillStyle = '#7dffa0'; ctx.font = `bold 40px ${FONT}`;
    ctx.fillText(canStart ? 'Tembak target hijau untuk ' + (state === 'over' ? 'main lagi' : 'mulai') : '...', W / 2, 455);
  }
  board.tex.needsUpdate = true;
}

function startGame() {
  state = 'playing'; score = 0; elapsed = 0; lives = LIVES; streak = 0; kills = 0; shots = 0; hits = 0;
  spawnT = 1.0; ufoT = R.randFloat(10, 16); newRecord = false; canStart = false; startT.visible = false;
  while (enemies.length) removeEnemy(enemies[0]);
  sfx.start(); lastKey = '';
}
function endGame() {
  state = 'over';
  for (const e of [...enemies]) { explode(e.position, 0xffffff, 10); removeEnemy(e); }
  if (score > best) { best = score; newRecord = true; try { localStorage.setItem('blaster_best', best); } catch (e) {} }
  sfx.over(); lastKey = '';
  setTimeout(() => { canStart = true; startT.visible = true; lastKey = ''; }, 2500);
}

// ---------- Senjata (controller / tangan) ----------
const ray = new THREE.Raycaster(); ray.far = 80;
const guns = [0, 1].map(i => {
  const c = renderer.xr.getController(i); scene.add(c);
  const color = i ? 0xff55ff : 0x33e0ff;
  const pointer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: .35 }));
  pointer.scale.z = 6; c.add(pointer);
  const gun = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.045, 0.14), new THREE.MeshStandardMaterial({ color: 0x222844, metalness: .8, roughness: .3 }));
  b.position.z = 0.02; const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.05, 12), new THREE.MeshBasicMaterial({ color }));
  tip.rotation.x = Math.PI / 2; tip.position.z = -0.07; gun.add(b, tip); c.add(gun);
  const o = { c, color, source: null, gun };
  c.addEventListener('connected', e => { o.source = e.data; gun.visible = !e.data.hand; });
  c.addEventListener('disconnected', () => { o.source = null; });
  c.addEventListener('selectstart', () => {
    const p = new THREE.Vector3(), q = new THREE.Quaternion();
    c.getWorldPosition(p); c.getWorldQuaternion(q);
    fire(p, new THREE.Vector3(0, 0, -1).applyQuaternion(q), color, o);
  });
  return o;
});
function haptic(o, s, ms) { try { o?.source?.gamepad?.hapticActuators?.[0]?.pulse(s, ms); } catch (e) {} }

function fire(origin, dir, color, gunObj) {
  initAudio(); sfx.laser(); haptic(gunObj, .35, 25);
  ray.set(origin, dir);
  const targets = startT.visible && canStart ? [...hitboxes, startHit, ...(renderer.xr.isPresenting ? [exitHit] : [])] : hitboxes;
  const hit = ray.intersectObjects(targets, false)[0];
  const end = hit ? hit.point : origin.clone().addScaledVector(dir, 40);
  beam(origin.clone().addScaledVector(dir, 0.08), end, color);
  if (!hit) { if (state === 'playing') { shots++; streak = 0; } return; }
  if (hit.object.userData.isExit) { exitXR(); return; }
  if (hit.object.userData.isStart) { explode(startT.position, 0x33ff77, 20); startGame(); return; }
  if (state !== 'playing') return;
  shots++; hits++;
  const e = hit.object.userData.enemy; e.userData.hp--;
  if (e.userData.hp > 0) {
    sfx.hit(); haptic(gunObj, .6, 40); e.userData.flash = .12;
    e.position.addScaledVector(dir, 0.6); // terdorong mundur
    return;
  }
  streak++; kills++;
  const cfg = ENEMY[e.userData.type];
  score += cfg.pts * mult();
  popup(e.position.clone().add(new THREE.Vector3(0, .35, 0)), '+' + cfg.pts * mult(), e.userData.type === 'ufo' ? '#ffe27a' : '#ffffff', e.userData.type === 'ufo' ? .9 : .6);
  const col = { drone: 0xff33cc, fast: 0x55ff66, tank: 0xff8833, ufo: 0xffcc33 }[e.userData.type];
  explode(e.position, col, e.userData.type === 'tank' || e.userData.type === 'ufo' ? 45 : 26);
  if (e.userData.type === 'ufo') sfx.bonus(); sfx.kill(); haptic(gunObj, .9, 70);
  removeEnemy(e);
}

function damage() {
  lives--; streak = 0; hurtT = .5; sfx.hurt();
  for (const g of guns) haptic(g, 1, 250);
  if (lives <= 0) endGame();
}

// mode tes laptop
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', ev => {
  if (renderer.xr.isPresenting) return;
  mouse.set(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const o = new THREE.Vector3(); camera.getWorldPosition(o); o.y -= 0.25;
  fire(ray.ray.origin.clone(), ray.ray.direction.clone(), 0x33e0ff, null);
});
renderer.xr.addEventListener('sessionend', () => { if (state === 'playing') endGame(); });

// ---------- Loop ----------
const clock = new THREE.Clock(); let now = 0, tick = -1;
const tmp = new THREE.Vector3(), side = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); now += dt;
  camera.getWorldPosition(head);

  if (state === 'playing') {
    elapsed += dt;
    const prog = Math.min(1, elapsed / DURATION), remain = Math.ceil(DURATION - elapsed);
    if (remain <= 5 && remain > 0 && remain !== tick) { tick = remain; tone(1000, .05, 'square', .1); }
    spawnT -= dt;
    if (spawnT <= 0 && enemies.length < 10) {
      const r = Math.random();
      const type = elapsed > 20 && r < .18 ? 'tank' : elapsed > 10 && r < .45 ? 'fast' : 'drone';
      spawn(type);
      if (prog > .5 && Math.random() < .3) spawn('drone');
      spawnT = R.lerp(1.7, 0.6, prog);
    }
    ufoT -= dt; if (ufoT <= 0) { spawn('ufo'); ufoT = R.randFloat(12, 18); }
    if (elapsed >= DURATION) endGame();
  }

  for (const e of [...enemies]) {
    const u = e.userData; u.t += dt;
    if (u.spinPart) u.spinPart.rotation.y += dt * 3;
    if (u.type === 'ufo') {
      e.position.addScaledVector(u.vel, dt); e.position.y += Math.sin(now * 3) * 0.005;
      if (Math.abs(e.position.x) > 16) removeEnemy(e);
      continue;
    }
    tmp.copy(head).sub(e.position); const dist = tmp.length(); tmp.normalize();
    e.position.addScaledVector(tmp, u.speed * dt);
    if (u.type === 'fast') { side.crossVectors(tmp, up).normalize(); e.position.addScaledVector(side, Math.cos(u.t * 3 + u.phase) * 2.2 * dt); }
    else e.position.y += Math.sin(u.t * 2 + u.phase) * 0.3 * dt;
    e.lookAt(head);
    const s = u.flash > 0 ? 1.25 : Math.min(1, u.t / 0.4); e.scale.setScalar(s); if (u.flash > 0) u.flash -= dt;
    if (dist < 0.9) { explode(e.position, 0xff2244, 30); removeEnemy(e); if (state === 'playing') damage(); }
  }

  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i]; b.userData.t += dt; b.material.opacity = Math.max(0, 1 - b.userData.t / .15);
    if (b.userData.t > .15) { scene.remove(b); b.geometry.dispose(); b.material.dispose(); beams.splice(i, 1); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], u = p.userData; u.t += dt;
    if (u.flash) { p.scale.setScalar(.2 + u.t * 4); p.material.opacity = Math.max(0, .9 - u.t / u.life); }
    else { u.v.multiplyScalar(1 - 1.5 * dt); p.position.addScaledVector(u.v, dt); p.rotation.x += u.spin * dt; p.rotation.y += u.spin * dt;
      p.material.opacity = Math.max(0, 1 - u.t / u.life); }
    if (u.t > u.life) { scene.remove(p); parts.splice(i, 1); }
  }
  if (hurtT > 0) { hurtT -= dt; hurtSphere.material.opacity = Math.max(0, hurtT) * 0.9; scene.background.lerpColors(BG, new THREE.Color(0x550011), Math.max(0, hurtT) * 2); }
  else { hurtSphere.material.opacity = 0; scene.background.copy(BG); }

  exitT.visible = startT.visible && renderer.xr.isPresenting;
  if (exitT.visible) { exitT.position.set(1.15, 1.3, -2.9); exitT.lookAt(head); }
  if (startT.visible) { startT.rotation.z += dt * 0.8; startT.position.y = 1.6 + Math.sin(now * 2) * 0.05; startT.lookAt(head); }
  planet.rotation.y += dt * 0.02;
  drawBoard();
  updatePopups();
  renderer.render(scene, camera);
});
</script>
</body>
