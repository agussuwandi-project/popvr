}

const AC = new THREE.Vector3(0, 0, -2.35);      // pusat lintasan
const N = 900, HW = 0.02;                         // jumlah titik, setengah lebar lakban (lebar 4 cm)

for (let i = 0; i < N; i++) {
  const t = i / N * Math.PI * 2, r = 1 + 0.38 * Math.sin(3 * t) + 0.1 * Math.cos(2 * t);
  TP[i * 2] = 1.3 * r * Math.cos(t); TP[i * 2 + 1] = 0.92 * r * Math.sin(t);
}
const SEG = new Float32Array(N * 3);              // dx, dz, panjang²
for (let i = 0; i < N; i++) { const j = (i + 1) % N, dx = TP[j * 2] - TP[i * 2], dz = TP[j * 2 + 1] - TP[i * 2 + 1];
  SEG[i * 3] = dx; SEG[i * 3 + 1] = dz; SEG[i * 3 + 2] = dx * dx + dz * dz; }
// jarak titik ke lintasan; cari di sekitar indeks petunjuk (atau semua bila hint < 0)
function jarak(px, pz, hint = -1, win = 70) {
  let best = 1e9, bi = 0, from = 0, to = N;
  if (hint >= 0) { from = hint - win; to = hint + win; }
  for (let k = from; k < to; k++) {
    const i = (k + N) % N, ax = TP[i * 2], az = TP[i * 2 + 1], dx = SEG[i * 3], dz = SEG[i * 3 + 1];
    let t = ((px - ax) * dx + (pz - az) * dz) / SEG[i * 3 + 2]; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = ax + dx * t - px, ez = az + dz * t - pz, d = ex * ex + ez * ez;
    if (d < best) { best = d; bi = i; }
  }
  return [Math.sqrt(best), bi];
}

{

function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrap(ctx, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; } else line = t; }
  if (line) ctx.fillText(line, x, y); return y;
}

// ---------- Robot (sumbu lokal: +x = depan, +z = kiri) ----------
const LA = 0.11, SP = 0.028, B = 0.16, WR = 0.032; // jarak sensor ke as roda, jarak antar sensor, lebar as, jari-jari roda
const XS = [-2, -1, 0, 1, 2];

const leds = [], wheels = [];
{

};
const S = {}; // keadaan simulasi
function resetSim() {
  Object.assign(S, { x: TP[0], z: TP[1], h: Math.atan2(SEG[1], SEG[0]), vl: 0, vr: 0, uL: 0, uR: 0,
    I: 0, pe: 0, last: 0, e: 0, u: 0, pT: 0, iT: 0, dT: 0, acc: 0, idx: 0, prog: 0, lapT: 0, rs: [0, 0, 0, 0, 0],
    off: false, offT: 0, lost: false });

}
const HN = 300, hist = new Float32Array(HN), histU = new Float32Array(HN); let hi = 0; // 6 detik riwayat error
let running = true, laps = [], best = null, offCount = 0, recentOff = 0, lastPreset = 'pas';
const rnd = () => (Math.random() - 0.5) * 0.04; // derau sensor kecil

function kontrol() {
  const fx = Math.cos(S.h), fz = Math.sin(S.h), lx = -fz, lz = fx;
  const rs = S.rs;
  for (let k = 0; k < 5; k++) {
    const px = S.x + fx * LA + lx * XS[k] * SP, pz = S.z + fz * LA + lz * XS[k] * SP;
    const d = jarak(px, pz, S.idx)[0];
    rs[k] = Math.min(1, Math.max(0, (d <= HW ? 1 : 1 - (d - HW) / 0.012) + rnd()));
  }
  const sum = rs.reduce((a, b) => a + b, 0);
  S.lost = sum < 0.1;
  if (P.mode === 'pid') {
    let e;
    if (S.lost) e = 1.2 * (S.last >= 0 ? 1 : -1);          // garis hilang: belok ke arah terakhir terlihat
    else { e = rs.reduce((a, r, k) => a + r * XS[k], 0) / sum / 2; S.last = e; }
    S.I = R.clamp(S.I + e * CTRL, -2, 2);
    const D = (e - S.pe) / CTRL; S.pe = e;
    S.pT = P.Kp * e; S.iT = P.Ki * S.I; S.dT = P.Kd * D;
    const u = S.pT + S.iT + S.dT; S.e = e; S.u = u;
    S.uL = R.clamp(P.spd - u, -1, 1); S.uR = R.clamp(P.spd + u, -1, 1);
  } else {                                                 // dua sensor, logika on/off seperti robot pameran
    const kiri = rs[3] > 0.5, kanan = rs[1] > 0.5;
    if (kiri && !kanan) { S.uL = 0; S.uR = P.spd; S.e = 0.5; }
    else if (kanan && !kiri) { S.uL = P.spd; S.uR = 0; S.e = -0.5; }
    else { S.uL = S.uR = P.spd; S.e = 0; }
    S.u = (S.uR - S.uL) / 2; S.pT = S.iT = S.dT = 0;
  }
  hist[hi] = S.e; histU[hi] = S.u; hi = (hi + 1) % HN;
}
const DT = 0.005;
function langkah() {   // satu langkah fisika 5 ms; mengembalikan 'lap' | 'off' | null
  if (S.off) { S.offT -= DT; if (S.offT <= 0) resetSim(); return null; }
  S.acc += DT; if (S.acc >= CTRL) { S.acc -= CTRL; kontrol(); }
  const a = 1 - Math.exp(-DT / TAU);
  S.vl += (S.uL * VMAX - S.vl) * a; S.vr += (S.uR * VMAX - S.vr) * a;
  const v = (S.vl + S.vr) / 2, w = (S.vr - S.vl) / B;
  S.h += w * DT; S.x += Math.cos(S.h) * v * DT; S.z += Math.sin(S.h) * v * DT;
  const [d, i] = jarak(S.x, S.z, S.idx, 40);
  let di = (i - S.idx + N) % N; if (di > N / 2) di -= N; S.prog += di; S.idx = i; S.lapT += DT;
  if (d > 0.17) { S.off = true; S.offT = 1.4; S.uL = S.uR = S.vl = S.vr = 0; return 'off'; }
  if (S.prog >= N) { S.prog -= N; const t = S.lapT; S.lapT = 0; return t; }
  return null;
}
resetSim();

// ---------- Suara ----------
let ac = null, motor = null, motorGain = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)();
    motor = ac.createOscillator(); motor.type = 'sawtooth'; motor.frequency.value = 80;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
    motorGain = ac.createGain(); motorGain.gain.value = 0; motor.connect(f).connect(motorGain).connect(ac.destination); motor.start(); } catch (e) {} }
  ac?.resume?.();
}
function tone(f, d, type = 'sine', vol = .2) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
addEventListener('pointerdown', initAudio); addEventListener('click', initAudio, true);
renderer.xr.addEventListener('sessionstart', initAudio);

// ---------- Panel tombol ----------
const panel = new THREE.Group(); panel.position.set(-0.62, 1.0, -0.5); panel.rotation.set(-0.7, 0.75, 0, 'YXZ'); scene.add(panel);
const panelBg = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.56, 0.015), new THREE.MeshStandardMaterial({ color: 0x172a2a, metalness: .3 }));
panelBg.position.set(0, -0.01, -0.01); panel.add(panelBg);
const buttons = [];
function drawFace(ctx, c, label, fs, sub) {
  ctx.clearRect(0, 0, c.width, c.height);
  const g = ctx.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(.5, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(0,0,0,.15)');
  ctx.fillStyle = g; rr(ctx, 4, 4, c.width - 8, c.height - 8, Math.min(c.height, c.width) * .22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4; rr(ctx, 4, 4, c.width - 8, c.height - 8, Math.min(c.height, c.width) * .22); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `bold ${fs}px ${FONT}`;
  if (sub) { ctx.fillStyle = '#8ff5df'; ctx.font = `600 ${fs * .55}px ${FONT}`; ctx.fillText(sub, c.width / 2, c.height * .28); ctx.fillStyle = '#fff'; ctx.font = `bold ${fs}px ${FONT}`; ctx.fillText(label, c.width / 2, c.height * .66); return; }
  if (ctx.measureText(label).width < c.width - 20) ctx.fillText(label, c.width / 2, c.height / 2 + 4);
  else { const [a, ...b] = label.split(' '); ctx.fillText(a, c.width / 2, c.height / 2 - fs * .5 + 4); ctx.fillText(b.join(' '), c.width / 2, c.height / 2 + fs * .55 + 4); }
}
function makeButton(label, x, y, action, color = 0x2f5a5a, w = 0.11, h = 0.1, fs = 72, sub) {
  const c = document.createElement('canvas'); c.width = Math.round(w * 2200); c.height = Math.round(h * 2200);
  const ctx = c.getContext('2d'); drawFace(ctx, c, label, fs, sub);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const base = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.025), new THREE.MeshStandardMaterial({ color, emissive: 0x000000 }));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w * .95, h * .95), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  face.position.z = 0.0131; base.add(face); base.position.set(x, y, 0.012);
  base.userData = { action, color, label, set: (l, s2) => { drawFace(ctx, c, l, fs, s2); tex.needsUpdate = true; } };
  panel.add(base); if (action) buttons.push(base); return base;
}
const NAMA = { Kp: 'Kp', Ki: 'Ki', Kd: 'Kd', spd: L('Kecepatan', 'Speed') };
const fmt = (k, v) => k === 'Kd' ? v.toFixed(3) : k === 'spd' ? Math.round(v * 100) + '%' : v.toFixed(1);
const disp = {};
['Kp', 'Ki', 'Kd', 'spd'].forEach((k, r) => {
  const y = 0.2 - r * 0.1, [lo, hi2, st] = LIM[k];
  const ubah = d => { P[k] = R.clamp(Math.round((P[k] + d * st) / st) * st, lo, hi2); if (P.mode !== 'pid' && k !== 'spd') P.mode = 'pid'; lastPreset = null; tone(d > 0 ? 760 : 520, .06, 'square', .08); refresh(); };
  makeButton('−', -0.27, y, () => ubah(-1), 0x5a2f3a, .07, .085, 80);
  disp[k] = makeButton(fmt(k, P[k]), -0.145, y, null, 0x203838, .16, .085, 50, NAMA[k]);
  makeButton('+', -0.02, y, () => ubah(1), 0x2f5a3a, .07, .085, 80);
});
const presetBtns = {};
Object.entries(PRESETS).forEach(([id, p], i) => {
  presetBtns[id] = makeButton(p.t, 0.18, 0.2 - i * 0.08, () => pakaiPreset(id), id === 'onoff' ? 0x5a4a2f : 0x2f4a73, .2, .07, 40);
  presetBtns[id].userData.preset = id;
});
const runBtn = makeButton(L('⏸ Jeda', '⏸ Pause'), -0.2, -0.225, () => { running = !running; runBtn.userData.set(running ? L('⏸ Jeda', '⏸ Pause') : L('▶ Jalan', '▶ Run')); tone(600, .08); }, 0x2f5a5a, .17, .065, 46);
makeButton(L('↺ Ulang', '↺ Restart'), -0.01, -0.225, () => { resetSim(); tone(440, .1); }, 0x6b5a2f, .17, .065, 46);
makeButton(L('✕ Keluar', '✕ Exit'), 0.19, -0.225, () => { try { renderer.xr.getSession()?.end(); } catch (e) {} }, 0x8a2433, .17, .065, 46);
function pakaiPreset(id) {
  const p = PRESETS[id]; Object.assign(P, { Kp: p.Kp, Ki: p.Ki, Kd: p.Kd, spd: p.spd, mode: p.mode }); lastPreset = id;
  resetSim(); running = true; runBtn.userData.set(L('⏸ Jeda', '⏸ Pause')); tone(880, .1, 'triangle', .15); refresh();
}
function refresh() { for (const k in disp) disp[k].userData.set(P.mode === 'onoff' && k !== 'spd' ? '—' : fmt(k, P[k]), NAMA[k]); lastInfo = ''; }

// ---------- Controller / tangan ----------
const ray = new THREE.Raycaster();
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i); scene.add(c);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .5 }));
  line.scale.z = 3; c.add(line);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffff66 }));
  dot.visible = false; scene.add(dot);
  const o = { c, line, dot, source: null, hover: null };
  c.addEventListener('connected', e => { o.source = e.data; });
  c.addEventListener('disconnected', () => { o.source = null; });
  c.addEventListener('selectstart', () => { initAudio(); if (o.hover) { press(o.hover); haptic(o, .6, 40); } });
  return o;
});
function haptic(o, s, ms) { try { o?.source?.gamepad?.hapticActuators?.[0]?.pulse(s, ms); } catch (e) {} }
function press(btn) { btn.userData.action(); btn.userData.pressT = .15; }
const tmpM = new THREE.Matrix4();
function updatePointers() {
  for (const b of buttons) b.material.emissive.setHex(b.userData.preset && b.userData.preset === lastPreset ? 0x2a6a20 : 0x000000);
  for (const o of ctrls) {
    o.hover = null; o.dot.visible = false;
    if (!o.source) continue;
    tmpM.identity().extractRotation(o.c.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(o.c.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
    const hit = ray.intersectObjects(buttons, false)[0];
    if (hit) { o.hover = hit.object; hit.object.material.emissive.setHex(0x335577); o.line.scale.z = hit.distance; o.dot.position.copy(hit.point); o.dot.visible = true; }
    else o.line.scale.z = 3;
  }
}
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', ev => {
  if (renderer.xr.isPresenting) return;
  mouse.set(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera); const hit = ray.intersectObjects(buttons, false)[0]; if (hit) press(hit.object);
});

// ---------- Panel info ----------
function diagnosa() {
  if (P.mode === 'onoff') return ['ON-OFF 2 sensor', L('Seperti robot pameran: sensor kiri kena garis → roda kiri berhenti. Aman, tapi lambat dan patah-patah. PID memakai SEBERAPA JAUH robot melenceng, bukan hanya kiri/kanan.', 'Like the exhibition robot: left sensor on the line → left wheel stops. Safe, but slow and jerky. PID uses HOW FAR the robot drifts, not just left/right.'), '#ffcf70'];
  let cross = 0, sq = 0; const n = 150;
  for (let k = 1; k < n; k++) { const a = hist[(hi - k + HN) % HN], b = hist[(hi - k - 1 + HN) % HN]; if (a * b < 0 && Math.abs(a - b) > 0.15) cross++; sq += a * a; }
  const rms = Math.sqrt(sq / n);
  if (recentOff > 0) return [L('Keluar lintasan!', 'Off the track!'), P.Kp < 0.6 ? L('Kp terlalu kecil: koreksinya lemah, robot tidak sempat berbelok di tikungan. Naikkan Kp.', 'Kp too small: the correction is weak, so the robot can\'t turn in time at corners. Raise Kp.') : L('Terlalu cepat untuk tikungan ini. Turunkan kecepatan, atau naikkan Kp dan Kd bersama.', 'Too fast for this corner. Lower the speed, or raise Kp and Kd together.'), '#ff6b8a'];
  if (cross > 9 && P.Kd < 0.015) return [L('Zig-zag', 'Zig-zag'), L('Kp besar tanpa peredam: robot selalu kelewatan lalu membalik arah. Naikkan Kd — suku D melawan perubahan error yang terlalu cepat.', 'Big Kp with no damping: the robot keeps overshooting and reversing. Raise Kd — the D term fights error that changes too fast.'), '#ffcf70'];
  if (cross > 9) return [L('Masih bergoyang', 'Still wobbling'), L('Coba naikkan Kd sedikit, atau turunkan Kp.', 'Try raising Kd a little, or lowering Kp.'), '#ffcf70'];
  if (rms > 0.35) return [L('Lambat mengoreksi', 'Slow to correct'), L('Robot sering jauh dari garis. Naikkan Kp agar koreksinya lebih kuat.', 'The robot often drifts far from the line. Raise Kp for a stronger correction.'), '#ffcf70'];
  if (P.Ki > 0.05) return [L('Mulus', 'Smooth'), L('Ki menghapus error yang menetap. Di lintasan berliku efeknya kecil — karena itu banyak line follower cukup memakai PD.', 'Ki removes steady error. On a winding track its effect is small — that\'s why many line followers only use PD.'), '#7dffa0'];
  return [L('Mulus', 'Smooth'), best && best < TARGET ? L('Tantangan selesai! Coba cari pengaturan yang lebih cepat lagi.', 'Challenge complete! Try to find an even faster setting.') : L(`Stabil. Tantangan: naikkan kecepatan dan setel ulang PID sampai satu putaran di bawah ${TARGET.toFixed(1)} detik.`, `Stable. Challenge: raise the speed and retune the PID until one lap takes under ${TARGET.toFixed(1)} seconds.`), '#7dffa0'];
}
let lastInfo = '', infoT = 0;
function drawInfo(force) {
  const [judul, saran, warna] = diagnosa();
  const keyS = [judul, saran, laps.length, offCount, Math.floor(S.lapT * 10), S.rs.map(r => r > .5 ? 1 : 0).join('')].join('|');
  if (!force && keyS === lastInfo) return; lastInfo = keyS;
  const { ctx, c } = info, Wd = c.width; ctx.clearRect(0, 0, Wd, c.height);
  glass(ctx, Wd, c.height, 'rgba(62,230,196,.9)', 36);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8ff5df'; ctx.font = `32px ${FONT}`; ctx.fillText(P.mode === 'pid' ? 'PID · 5 SENSOR' : 'ON-OFF · 2 SENSOR', 44, 66);
  ctx.fillStyle = warna; ctx.font = `bold 60px ${FONT}`; ctx.fillText(judul, 44, 130);
  ctx.fillStyle = '#d8f0ee'; ctx.font = `30px ${FONT}`; let y = wrap(ctx, saran, 44, 178, Wd - 88, 40);
  // sensor
  y = Math.max(y + 56, 330);
  ctx.fillStyle = '#8ff5df'; ctx.font = `28px ${FONT}`; ctx.fillText(L('SENSOR', 'SENSORS'), 44, y);
  S.rs.forEach((r, k) => { const cx = 230 + (4 - k) * 70, on = r > .5, dim = P.mode === 'onoff' && k !== 1 && k !== 3;
    ctx.beginPath(); ctx.arc(cx, y - 10, 22, 0, Math.PI * 2); ctx.fillStyle = dim ? 'rgba(255,255,255,.06)' : on ? '#ff3b3b' : 'rgba(255,255,255,.15)'; ctx.fill(); });
  // grafik error
  const gx = 44, gy = y + 30, gw = Wd - 88, gh = 190;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(ctx, gx, gy, gw, gh, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, gy + gh / 2); ctx.lineTo(gx + gw, gy + gh / 2); ctx.stroke();
  for (const [arr, col, sc] of [[histU, 'rgba(255,63,164,.8)', .35], [hist, '#3ee6c4', .4]]) {
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
    for (let k = 0; k < HN; k++) { const v = R.clamp(arr[(hi + k) % HN] * sc, -.5, .5), px = gx + k / (HN - 1) * gw, py = gy + gh / 2 - v * gh;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke();
  }
  ctx.font = `24px ${FONT}`; ctx.fillStyle = '#3ee6c4'; ctx.fillText(L('error (posisi garis)', 'error (line position)'), gx + 14, gy + gh + 34);
  ctx.fillStyle = '#ff7cc0'; ctx.fillText(L('koreksi belok', 'steering correction'), gx + 300, gy + gh + 34);
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillText(L('6 detik terakhir', 'last 6 seconds'), gx + gw - 180, gy + gh + 34);
  // suku P I D
  y = gy + gh + 86;
  if (P.mode === 'pid') {
    ctx.fillStyle = '#8ff5df'; ctx.font = `28px ${FONT}`; ctx.fillText(L('KOREKSI = P + I + D', 'CORRECTION = P + I + D'), 44, y);
    [['P', S.pT, '#3ee6c4'], ['I', S.iT, '#ffcf70'], ['D', S.dT, '#a48cff']].forEach(([n, v, col], k) => {
      const yy = y + 18 + k * 46, cx = Wd / 2 + 60, bw = 280, len = Math.min(1, Math.abs(v)) * bw;
      ctx.fillStyle = '#fff'; ctx.font = `bold 30px ${FONT}`; ctx.fillText(n, 60, yy + 30);
      ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(cx - bw, yy + 8, bw * 2, 28);
      ctx.fillStyle = '#fff'; ctx.fillRect(cx - 2, yy + 2, 4, 40);
      ctx.fillStyle = col; ctx.fillRect(v >= 0 ? cx : cx - len, yy + 8, len, 28);
    });
    y += 205;
  } else y += 30;
  // waktu putaran
  ctx.fillStyle = '#8ff5df'; ctx.font = `28px ${FONT}`; ctx.fillText(L('WAKTU PUTARAN', 'LAP TIME'), 44, y);
  ctx.fillStyle = '#fff'; ctx.font = `bold 52px ${FONT}`; ctx.fillText(S.off ? '—' : S.lapT.toFixed(1) + ' s', 44, y + 60);
  ctx.font = `30px ${FONT}`; ctx.fillStyle = best && best < TARGET ? '#7dffa0' : '#ffd23f';
  ctx.fillText(L(`Terbaik: ${best ? best.toFixed(2) + ' s' : '—'}   ·   Target < ${TARGET.toFixed(1)} s`, `Best: ${best ? best.toFixed(2) + ' s' : '—'}   ·   Target < ${TARGET.toFixed(1)} s`), 300, y + 52);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = `25px ${FONT}`;
  laps.slice(-3).reverse().forEach((l, k) => ctx.fillText(`${l.t.toFixed(2)} s  ·  ${l.cfg}`, 44, y + 110 + k * 36));
  ctx.fillStyle = '#ff8aa5'; if (offCount) ctx.fillText(L(`Keluar lintasan: ${offCount}x`, `Off track: ${offCount}x`), Wd - 300, c.height - 36);
  info.tex.needsUpdate = true;
}
const cfgStr = () => P.mode === 'onoff' ? `ON-OFF · ${Math.round(P.spd * 100)}%` : `Kp ${P.Kp.toFixed(1)}  Ki ${P.Ki.toFixed(1)}  Kd ${P.Kd.toFixed(3)}  · ${Math.round(P.spd * 100)}%`;
refresh();

// ---------- Loop ----------
const clock = new THREE.Clock(); let trailT = 0, physAcc = 0;
function tampilkanRobot() {
  robot.position.set(AC.x + S.x, 0, AC.z + S.z); robot.rotation.y = -S.h;
  S.rs.forEach((r, k) => leds[k].material.color.setHex(r > .5 ? 0xff2a2a : 0x331111));
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  updatePointers();
  if (running) {
    physAcc += dt;
    while (physAcc >= DT) { physAcc -= DT;
      const r = langkah();
      if (r === 'off') { offCount++; recentOff = 3; popup(robot.position.clone().setY(.3), L('Keluar lintasan!', 'Off the track!'), '#ff6b8a', .5); tone(180, .35, 'sawtooth', .15); for (const o of ctrls) haptic(o, .8, 120); }
      else if (typeof r === 'number') {
        laps.push({ t: r, cfg: cfgStr() }); if (laps.length > 20) laps.shift();
        const rekor = !best || r < best; if (rekor) best = r;
        popup(robot.position.clone().setY(.3), r.toFixed(2) + ' s' + (rekor ? L(' · rekor!', ' · record!') : ''), r < TARGET ? '#7dffa0' : '#ffd23f', .5);
        (r < TARGET ? [660, 880, 1100, 1320] : [880, 1100]).forEach((f, i) => setTimeout(() => tone(f, .16, 'square', .1), i * 110));
      }
    }
    trailT += dt; if (trailT > 0.03 && !S.off) { trailT = 0; pushTrail(S.x, S.z); }
    wheels[0].rotation.z -= S.vl / WR * dt; wheels[1].rotation.z -= S.vr / WR * dt;
  }
  if (recentOff > 0) recentOff -= dt;
  tampilkanRobot();
  if (motorGain) { const load = running && !S.off ? (Math.abs(S.vl) + Math.abs(S.vr)) / 2 / VMAX : 0;
    motorGain.gain.setTargetAtTime(Math.min(.08, load * .07), ac.currentTime, .05); motor.frequency.setTargetAtTime(70 + load * 160 + Math.abs(S.vr - S.vl) * 60, ac.currentTime, .05); }
  for (const b of buttons) { if (b.userData.pressT > 0) { b.userData.pressT -= dt; b.position.z = 0.004; } else b.position.z = 0.012; }
  infoT += dt; if (infoT > 0.1) { infoT = 0; drawInfo(); }
  updatePopups();
  renderer.render(scene, camera);
});

// kait uji: jalankan fisika tanpa render
window.__lf = { info: () => info.c.toDataURL(), catatan: () => ({ laps, best, offCount }),
  P, S, preset: pakaiPreset,
  simulasi(detik) { resetSim(); let t = 0; while (t < detik) { const r = langkah(); t += DT; if (r === 'off') return { off: true, t }; if (typeof r === 'number') return { lap: r }; } return { lap: null, prog: S.prog / N }; },
};
</script>
