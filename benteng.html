// =================== JARINGAN ===================
// Dua jalur dengan antarmuka sama: Firebase (antar-headset) atau lokal (antar-tab).
function makeLocalTransport() {
  const ch = new BroadcastChannel('benteng4'); let tree = {}; const subs = []; let n = 0;
  const parts = p => p.split('/').filter(Boolean);
  const get = p => parts(p).reduce((o, k) => (o == null ? undefined : o[k]), tree);
  function setRaw(p, v) {
    const ks = parts(p); let o = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null || v === undefined) delete o[ks.at(-1)]; else o[ks.at(-1)] = structuredClone(v);
  }
  const rel = (a, b) => a === b || a.startsWith(b + '/') || b.startsWith(a + '/');
  const notify = p => { for (const s of subs) if (rel(s.path, p)) s.cb(structuredClone(get(s.path) ?? null)); };
  function apply(m) {
    if (m.op === 'set') { setRaw(m.path, m.val); notify(m.path); return; }
    const paths = Object.keys(m.val).map(k => m.path + '/' + k); for (const k in m.val) setRaw(m.path + '/' + k, m.val[k]);
    for (const s of subs) if (paths.some(p => rel(s.path, p))) s.cb(structuredClone(get(s.path) ?? null));
  }
  ch.onmessage = e => {
    const m = e.data;
    if (m.op === 'hello') ch.postMessage({ op: 'tree', tree });
    else if (m.op === 'tree') { if (!Object.keys(tree).length && Object.keys(m.tree).length) { tree = m.tree; for (const s of subs) s.cb(structuredClone(get(s.path) ?? null)); } }
    else apply(m);
  };
  ch.postMessage({ op: 'hello' });
  const dis = []; addEventListener('pagehide', () => { for (const p of dis) ch.postMessage({ op: 'set', path: p, val: null }); });
  const send = m => { apply(m); ch.postMessage(m); };
  setNet(true, 'Mode lokal (antar-tab)');
  return {
    kind: 'local', now: () => Date.now(), ready: new Promise(r => setTimeout(r, 300)),
    set: (p, v) => send({ op: 'set', path: p, val: v }),
    update: (p, v) => send({ op: 'update', path: p, val: v }),
    remove: p => send({ op: 'set', path: p, val: null }),
    push: (p, v) => { const k = Date.now().toString(36) + (n++).toString(36) + Math.random().toString(36).slice(2, 5); send({ op: 'set', path: p + '/' + k, val: v }); return k; },
    on: (p, cb) => { subs.push({ path: p, cb }); cb(structuredClone(get(p) ?? null)); },
    onDisconnectRemove: p => dis.push(p),
    get: async p => structuredClone(get(p) ?? null),
  };
}
async function makeFirebaseTransport(cfg) {
  const V = '12.16.0';
  const fa = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fd = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const db = fd.getDatabase(fa.initializeApp(cfg));
  let offset = 0;
  fd.onValue(fd.ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
  fd.onValue(fd.ref(db, '.info/connected'), s => setNet(!!s.val(), s.val() ? 'Online (Firebase)' : 'Terputus — mencoba lagi…'));
  const Rf = p => fd.ref(db, p);
  return {
    kind: 'firebase', now: () => Date.now() + offset, ready: Promise.resolve(),
    set: (p, v) => fd.set(Rf(p), v), update: (p, v) => fd.update(Rf(p), v), remove: p => fd.remove(Rf(p)),
    push: (p, v) => { const r = fd.push(Rf(p)); fd.set(r, v); return r.key; },
    on: (p, cb) => fd.onValue(Rf(p), s => cb(s.val())),
    onDisconnectRemove: p => fd.onDisconnect(Rf(p)).remove(),
    get: async p => (await fd.get(Rf(p))).val(),
  };
}
const useFirebase = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('ISI_') && FIREBASE_CONFIG.databaseURL && new URLSearchParams(location.search).get('lokal') !== '1';
let net;
try { net = useFirebase ? await makeFirebaseTransport(FIREBASE_CONFIG) : makeLocalTransport(); }
catch (e) { console.error(e); net = makeLocalTransport(); setNet(false, 'Firebase gagal — mode lokal'); }
await net.ready;

// =================== SCENE ===================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const BG = new THREE.Color(0x04060f); scene.background = BG.clone(); scene.fog = new THREE.Fog(0x04060f, 25, 70);
const FOG = scene.fog;
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.03, 300);
camera.position.set(0, 1.6, 0);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
scene.add(new THREE.HemisphereLight(0xaabbff, 0x332244, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-3, 8, 2); scene.add(sun);

const env = new THREE.Group(); scene.add(env);
{
  const grid = new THREE.GridHelper(120, 120, 0x3a2a88, 0x1a1640); grid.position.y = -6; env.add(grid);
  const n = 1600, p = new Float32Array(n * 3);

  body.position.y = -3.02; env.add(body);
}
// lantai puncak menara + benteng (tetap tampil di MR sebagai pijakan virtual)
const tower = new THREE.Group(); scene.add(tower);
{
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, 0.06, 40), new THREE.MeshStandardMaterial({ color: 0x2c3558, metalness: .4, roughness: .5 }));
  top.position.y = -0.03; tower.add(top);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    const m = new THREE.Mesh(new THREE.BoxGeometry(.38, .32, .18), new THREE.MeshStandardMaterial({ color: 0x3b4670 }));
    m.position.set(Math.sin(a) * 1.78, .16, Math.cos(a) * 1.78); m.rotation.y = a; tower.add(m);
  }

    const a = i * Math.PI / 2, f = new THREE.Vector3(-Math.sin(a), 0, -Math.cos(a));
    const pad = new THREE.Mesh(new THREE.RingGeometry(.22, .3, 32), new THREE.MeshBasicMaterial({ color: s.color, side: THREE.DoubleSide }));
    pad.rotation.x = -Math.PI / 2; pad.position.copy(f).multiplyScalar(SEAT_R).setY(.005); tower.add(pad);
    const beacon = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 14, 8), new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: .35 }));
    beacon.position.copy(f).multiplyScalar(SPAWN_R + 3).setY(1); env.add(beacon);
  });
}
// Kristal Inti
const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(.32, 0), new THREE.MeshStandardMaterial({ color: 0x7af3ff, emissive: 0x2aa8ff, emissiveIntensity: 1.1, metalness: .3, flatShading: true }));
crystal.position.set(0, 2.7, 0); scene.add(crystal);
let xrKind = null;
function applyEnv() { const ar = xrKind === 'ar'; env.visible = !ar; scene.background = ar ? null : BG.clone(); scene.fog = ar ? null : FOG; }

// =================== UTILITAS VISUAL ===================
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function glass(ctx, W, H, accent, rad = 40) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(38,34,78,.84)'); g.addColorStop(1, 'rgba(8,12,30,.84)');
  ctx.fillStyle = g; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.fill();
  ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 24; ctx.strokeStyle = accent; ctx.lineWidth = 5; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.stroke(); ctx.restore();
  const hl = ctx.createLinearGradient(0, 0, 0, H * .45); hl.addColorStop(0, 'rgba(255,255,255,.14)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; rr(ctx, 14, 14, W - 28, H * .4, Math.max(8, rad - 8)); ctx.fill();
}
function makePanel(w, h, cw, ch) {
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  return { mesh, ctx, tex, c };
}
function labelSprite(text, color, w = .5) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  glass(x, 512, 128, color, 30); x.fillStyle = '#fff'; x.font = `700 60px ${FONT}`;
  const fs = Math.min(60, Math.floor(60 * 450 / Math.max(1, x.measureText(text).width))); x.font = `700 ${fs}px ${FONT}`;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false })); s.scale.set(w, w / 4, 1); return s;
}
const fx = [];
function beam(from, to, color) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([from, to]), new THREE.LineBasicMaterial({ color, transparent: true }));
  l.userData = { t: 0, life: .15 }; scene.add(l); fx.push(l);
}
const pGeo = new THREE.BoxGeometry(1, 1, 1);
function explode(pos, color, n = 22, size = .06, spd = 3.5) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pGeo, mat); p.position.copy(pos); p.scale.setScalar(size * R.randFloat(.5, 1.3));

    scene.add(p); fx.push(p);
  }
  const f = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .9, blending: THREE.AdditiveBlending }));
  f.position.copy(pos); f.scale.setScalar(.12); f.userData = { t: 0, life: .25, grow: 1.1 }; scene.add(f); fx.push(f);
}
function popup(pos, text, color = '#fff', size = .6) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  x.font = `700 80px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 10; x.strokeStyle = 'rgba(0,0,0,.6)';
  x.strokeText(text, 256, 64); x.fillStyle = color; x.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.position.copy(pos); s.scale.set(size, size / 4, 1); s.renderOrder = 998; s.userData = { t: 0, life: .9, rise: .5, tex }; scene.add(s); fx.push(s);
}
const hurtSphere = new THREE.Mesh(new THREE.SphereGeometry(.25, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff0022, transparent: true, opacity: 0, side: THREE.BackSide, depthTest: false }));
hurtSphere.renderOrder = 999; camera.add(hurtSphere); let hurtT = 0;

// =================== SUARA ===================
let ac = null, noiseBuf = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); noiseBuf = ac.createBuffer(1, ac.sampleRate * .8, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) {} }
  ac?.resume?.();
}
function tone(f, d, type = 'sine', vol = .18, ramp = 1) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f * ramp), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
function boom(vol = .5, dur = .5, freq = 1200) { if (!ac || !noiseBuf) return; const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur); }
addEventListener('pointerdown', initAudio); addEventListener('click', initAudio, true);

// =================== STATE JARINGAN ===================
const params = new URLSearchParams(location.search);
let ROOM = null, SLOT = -1, NAME = '';
let players = {};          // data mentah dari jaringan: p0..p3
let game = { st: 'idle' };  // status ronde (ditulis siapa saja saat mulai; selebihnya oleh host)

let hitsData = {};         // antrean tembakan kena (dibaca & dihapus host)
const base = () => `rooms/${ROOM}`;
const present = () => { const t = net.now(), out = []; for (let i = 0; i < MAX_P; i++) { const p = players['p' + i]; if (p && t - (p.t || 0) < 6000) out.push(i); } return out; };
const isHost = () => { const p = present(); return p.length && p[0] === SLOT; };

function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
async function joinRoom(code, name) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4) throw new Error('Kode ruangan harus 4 karakter.');
  const ps = (await net.get(`rooms/${code}/players`)) || {}; const t = net.now();
  let slot = -1; for (let i = 0; i < MAX_P; i++) { const p = ps['p' + i]; if (!p || t - (p.t || 0) > 8000) { slot = i; break; } }
  if (slot < 0) throw new Error('Ruangan penuh (maksimal 4 pemain).');
  ROOM = code; SLOT = slot; NAME = (name || 'Pemain').slice(0, 12);
  net.onDisconnectRemove(`${base()}/players/p${slot}`);
  publishSelf();
  net.on(`${base()}/players`, v => { players = v || {}; renderLobby(); });
  net.on(`${base()}/game`, v => onGame(v || { st: 'idle' }));
  net.on(`${base()}/en`, v => { enemiesData = v || {}; syncEnemies(); });
  net.on(`${base()}/hits`, v => { hitsData = v || {}; onHits(); });

  if (game.st !== 'play' && renderer.xr.isPresenting) list.push(exitHit);
  const hit = ray.intersectObjects(list, false)[0];
  beam(origin.clone().addScaledVector(dir, .08), hit ? hit.point : origin.clone().addScaledVector(dir, 30), SEATS[Math.max(0, SLOT)].color);
  if (!hit) return;
  const u = hit.object.userData;
  if (u.kind === 'exit') { try { renderer.xr.getSession()?.end(); } catch (e) {} return; }
  if (u.kind === 'start') { explode(startT.position, 0xffb020, 20); startRound(); return; }
  if (game.st !== 'play' || net.now() < game.startAt) return;
  if (u.kind === 'boss') { bossFlash = .12; tone(300, .08, 'triangle', .15, 2); net.push(`${base()}/hits`, { e: 'boss', s: SLOT, t: net.now() }); haptic(g, .6, 40); return; }
  if (u.kind === 'enemy') {
    const m = enemyMeshes.get(u.id), e = enemiesData[u.id]; if (!m || !e) return;
    m.userData.pend++; tone(520, .08, 'triangle', .18, 2); haptic(g, .7, 50);
    if (m.userData.pend >= e.hp) { // respons instan: sembunyikan dulu, host yang mengesahkan
      m.userData.gone = true; m.visible = false; explode(m.position, ENEMY[e.ty].color); boom(.4, .45);
      popup(m.position.clone().add(new THREE.Vector3(0, .35, 0)), '+' + ENEMY[e.ty].pts, '#ffe27a'); m.userData.goneAt = performance.now();
    } else m.userData.flash = .12;
    net.push(`${base()}/hits`, { e: u.id, s: SLOT, t: net.now() });
  }
}

// ---- mode tes laptop: seret mouse untuk menoleh, klik untuk menembak
let yaw = 0, pitch = 0, drag = null;
renderer.domElement.addEventListener('pointerdown', ev => { if (!renderer.xr.isPresenting) drag = { x: ev.clientX, y: ev.clientY, moved: false }; });
addEventListener('pointermove', ev => { if (!drag) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (drag.moved) { yaw -= dx * .004; pitch = R.clamp(pitch - dy * .004, -1.4, 1.4); drag.x = ev.clientX; drag.y = ev.clientY; camera.rotation.set(pitch, yaw, 0, 'YXZ'); } });
addEventListener('pointerup', ev => {
  if (!drag) return; const moved = drag.moved; drag = null; if (moved || renderer.xr.isPresenting) return;
  const m = new THREE.Vector2(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1); ray.setFromCamera(m, camera);
  fire(ray.ray.origin.clone(), ray.ray.direction.clone(), null);
});

// =================== LOBI (HTML) ===================
const ov = $('ov'), msg = $('msg');
$('inName').value = params.get('name') || localStorage.getItem('b4_name') || '';
async function doJoin(code) {
  const name = $('inName').value.trim() || 'Pemain'; try { localStorage.setItem('b4_name', name); } catch (e) {}
  msg.textContent = 'Menyambung…';
  try { await joinRoom(code, name); $('stepJoin').hidden = true; $('stepLobby').hidden = false; $('codeOut').textContent = ROOM; msg.textContent = ''; checkXR(); { const u = new URLSearchParams(location.search); u.set('room', ROOM); u.delete('auto'); history.replaceState(null, '', '?' + u); } }
  catch (e) { msg.textContent = e.message || String(e); }
}
$('btnCreate').onclick = () => doJoin(genCode());
$('btnJoin').onclick = () => doJoin($('inCode').value);
function renderLobby() {
  const pres = present();
  $('plist').innerHTML = SEATS.map((s, i) => { const p = players['p' + i], on = pres.includes(i);
    return `<div class="pl" style="border-color:${on ? s.css : 'rgba(255,255,255,.15)'}"><b style="color:${on ? s.css : '#778'}">${on ? (p.n || '').replace(/[<>&]/g, '') : 'kosong'}${i === SLOT ? ' (kamu)' : ''}</b>${s.name}</div>`; }).join('');
}
async function checkXR() {
  if (!navigator.xr) { msg.textContent = 'WebXR tidak tersedia. Mode tes laptop: seret untuk menoleh, klik untuk menembak.'; return; }
  const [ar, vr] = await Promise.all([navigator.xr.isSessionSupported('immersive-ar').catch(() => false), navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  $('btnAR').disabled = !ar; $('btnVR').disabled = !vr;
  if (!vr) msg.textContent = 'Perangkat XR tidak terdeteksi. Mode tes laptop: seret untuk menoleh, klik untuk menembak.';
}
async function startXR(kind) {
  initAudio();
  try {
    const s = await navigator.xr.requestSession(kind === 'ar' ? 'immersive-ar' : 'immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
    xrKind = kind; applyEnv(); camera.rotation.set(0, 0, 0);
    s.addEventListener('end', () => { xrKind = null; applyEnv(); ov.classList.remove('hide'); camera.position.set(0, 1.6, 0); });
    await renderer.xr.setSession(s); ov.classList.add('hide');
  } catch (e) { msg.textContent = 'Gagal memulai: ' + e.message; xrKind = null; applyEnv(); }
}
$('btnVR').onclick = () => startXR('vr'); $('btnAR').onclick = () => startXR('ar');
if (params.get('room')) { $('inCode').value = params.get('room'); if (params.get('auto') === '1') doJoin(params.get('room')); }

// =================== LOOP ===================
const clock = new THREE.Clock(); let now = 0, pubT = 0, hostT = 0;
const ePos = new THREE.Vector3();
// Cadangan saat tab/headset tidak tampil: browser membekukan loop render,
// jadi detak kehadiran + logika host tetap jalan lewat timer (min. ~1×/detik).
let lastFrame = performance.now();
setInterval(() => {
  if (performance.now() - lastFrame < 500) return;      // loop render masih hidup
  if (SLOT >= 0) publishSelf();
  hostTick();
}, 250);
renderer.setAnimationLoop(() => {
  lastFrame = performance.now();
  const dt = Math.min(clock.getDelta(), .05); now += dt; const t = net.now();
  pubT += dt; if (pubT > 1 / 12 && SLOT >= 0) { pubT = 0; publishSelf(); }
  hostT += dt; if (hostT > .1) { hostT = 0; hostTick(); }
  updateAvatars(dt);
  // musuh
  for (const [id, m] of enemyMeshes) {
    const e = enemiesData[id]; if (!e) continue;
    enemyPos(e, t, m.position); m.lookAt(CENTER);
    if (m.userData.spin) m.userData.spin.rotation.y += dt * 3;
    const age = (t - e.t0) / 1000; m.scale.setScalar(m.userData.flash > 0 ? 1.25 : Math.min(1, age / .4)); if (m.userData.flash > 0) m.userData.flash -= dt;
    if (m.userData.gone && performance.now() - m.userData.goneAt > 2000) { m.userData.gone = false; m.visible = true; m.userData.pend = 0; } // host tak mengesahkan → munculkan lagi
  }
  // boss
  boss.visible = !!game.boss?.on && game.st === 'play';
  if (boss.visible) {
    bossHull.rotation.y += dt * .5; boss.position.y = BOSS_Y + Math.sin(now * .8) * .25;
    const need = Math.max(1, present().length), open = (game.boss.cb || 0) >= need;
    shield.material.opacity = open ? .04 : .18 + (bossFlash > 0 ? .25 : 0); shield.material.color.setHex(open ? 0x7dffc0 : 0x66ccff);
    bossCore.material.color.setHex(bossFlash > 0 ? 0xffffff : 0xff2255); if (bossFlash > 0) bossFlash -= dt;
  }
  // kristal
  crystal.rotation.y += dt * 1.2; crystal.position.y = 2.7 + Math.sin(now * 2) * .06;
  const lf = Math.max(0, (game.lives ?? LIVES) / LIVES); crystal.material.emissive.setHSL(.55 * lf, 1, .45); crystal.scale.setScalar(.6 + .4 * lf);
  // target mulai / keluar
  startT.visible = game.st !== 'play' && SLOT >= 0; exitT.visible = startT.visible && renderer.xr.isPresenting;
  if (startT.visible) { startT.rotation.z += dt * .8; }
  if (startT.visible) startT.lookAt(rig.position.clone().setY(1.6)); if (exitT.visible) exitT.lookAt(rig.position.clone().setY(1.6));
  // efek
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], u = f.userData; u.t += dt; const k = u.t / u.life;
    if (u.phys) { u.v.multiplyScalar(1 - 1.5 * dt); f.position.addScaledVector(u.v, dt); f.rotation.x += 5 * dt; }
    if (u.grow) f.scale.setScalar(.1 + k * u.grow); if (u.rise) f.position.y += u.rise * dt;
    f.material.opacity = Math.max(0, 1 - k);
    if (u.t > u.life) { scene.remove(f); if (u.tex) u.tex.dispose(); fx.splice(i, 1); }
  }
  if (hurtT > 0) { hurtT -= dt; hurtSphere.material.opacity = Math.max(0, hurtT) * .9; } else hurtSphere.material.opacity = 0;
  for (const g of guns) g.tip.material.color.setHex(SEATS[Math.max(0, SLOT)].color);
  drawBoard();
  renderer.render(scene, camera);
});
setInterval(renderLobby, 1500);
// untuk pengujian otomatis
window.__b = { get slot() { return SLOT; }, get room() { return ROOM; }, get players() { return players; }, get game() { return game; },
  get enemies() { return Object.keys(enemiesData).length; }, present, isHost, fireAt: (id) => { const m = enemyMeshes.get(id); if (!m) return false;
    const o = camera.getWorldPosition(new THREE.Vector3()); fire(o, m.position.clone().sub(o).normalize(), null); return true; },
  fireBoss: () => { const o = camera.getWorldPosition(new THREE.Vector3()); fire(o, boss.position.clone().sub(o).normalize(), null); },
  fireStart: () => { const o = camera.getWorldPosition(new THREE.Vector3()); fire(o, startT.position.clone().sub(o).normalize(), null); },
  enemyIds: () => [...enemyMeshes.keys()] };
</script>
