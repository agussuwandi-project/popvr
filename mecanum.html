  <p data-en="Drive a holonomic robot that can slide sideways. See the force on each wheel and its kinematics formula live.">Kendalikan robot holonomic yang bisa bergeser ke samping. Lihat gaya di tiap roda dan rumus kinematikanya secara langsung.</p>
  <div class="btns"><button class="btn primary" id="btnVR" disabled data-en="Enter VR <span class=&quot;arw&quot;>→</span>">Masuk VR <span class="arw">→</span></button></div>

<script type="module">
import * as THREE from 'three';
const tr = window.L; // teks ID/EN (nama L sudah dipakai untuk panjang robot)

// ====== PENGATURAN (silakan ubah) ======
const HEADER = 'UVERS · Prodi TIF · ME · IE';
const VMAX = 0.6;   // kecepatan maksimum (m/s)
const WMAX = 1.3;   // kecepatan putar maksimum (rad/s)
const ARENA = 3.6;  // ukuran arena (m)
const STARS = 5;    // jumlah bintang misi
// =======================================

// ---------- Gaya visual bersama (font, panel kaca, angka melayang) ----------
await Promise.race([document.fonts.load("700 40px 'Space Grotesk'"), new Promise(r => setTimeout(r, 1500))]).catch(() => {});
const FONT = "'Space Grotesk', system-ui, sans-serif";
function glass(ctx, W, H, accent, rad = 40) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(38,34,78,.82)'); g.addColorStop(1, 'rgba(8,12,30,.82)');
  ctx.fillStyle = g; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.fill();
  ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 24; ctx.strokeStyle = accent; ctx.lineWidth = 5; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.stroke(); ctx.restore();
  const hl = ctx.createLinearGradient(0, 0, 0, H * .45); hl.addColorStop(0, 'rgba(255,255,255,.14)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; rr(ctx, 14, 14, W - 28, H * .42, Math.max(8, rad - 8)); ctx.fill();
}
const __pops = [];
function popup(pos, text, color = '#ffffff', size = .3) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  x.font = `700 84px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 10; x.strokeStyle = 'rgba(0,0,0,.55)'; x.strokeText(text, 256, 64); x.fillStyle = color; x.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.position.copy(pos); s.scale.set(size, size / 4, 1); s.renderOrder = 998; scene.add(s); __pops.push({ s, tex, t0: performance.now() });
}
function updatePopups() {
  const now = performance.now();
  for (let i = __pops.length - 1; i >= 0; i--) { const p = __pops[i], k = (now - p.t0) / 900;
    p.s.position.y += 0.004; p.s.material.opacity = Math.max(0, 1 - k * k);
    if (k >= 1) { scene.remove(p.s); p.tex.dispose(); p.s.material.dispose(); __pops.splice(i, 1); } }
}

const R = THREE.MathUtils;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
// ---- tombol Masuk VR (menggantikan VRButton bawaan agar senada dengan tema)
{
  const ov = document.getElementById('ov'), msg = document.getElementById('msg'), btnVR = document.getElementById('btnVR');
  const laptop = tr('Mode tes laptop: klik tombol di panel untuk menggerakkan robot.', 'Laptop test mode: click the panel buttons to move the robot.');
  (async () => {
    if (!navigator.xr) { msg.textContent = tr('WebXR tidak tersedia. ', 'WebXR not available. ') + laptop; return; }
    const ok = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
    btnVR.disabled = !ok;
    msg.textContent = ok ? tr('Siap! Tekan Masuk VR, lalu pakai headset.', 'Ready! Press Enter VR, then put on the headset.') : tr('Headset tidak terdeteksi. ', 'No headset detected. ') + laptop;
  })();
  btnVR.onclick = async () => {
    try {
      const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers'] });
      s.addEventListener('end', () => ov.classList.remove('hide'));
      await renderer.xr.setSession(s); ov.classList.add('hide');
    } catch (e) { msg.textContent = tr('Gagal memulai: ', 'Failed to start: ') + e.message; }
  };
}

const scene = new THREE.Scene();
import('./logo3d.js').then(m => m.pasangLogo3D(renderer, scene)).catch(e => console.warn('logo3d', e));
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 10, 30);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 100);
camera.position.set(0, 1.7, 0.6); camera.lookAt(0, 0.5, -2);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- Lingkungan / arena ----------
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x223040, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 5, 1);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: .5, far: 12 });
scene.add(key);
const AC = new THREE.Vector3(0, 0, -2.4); // pusat arena
key.target.position.copy(AC); scene.add(key.target);
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x141c2b, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const mat = new THREE.Mesh(new THREE.BoxGeometry(ARENA, 0.02, ARENA), new THREE.MeshStandardMaterial({ color: 0x23324a, roughness: .8 }));
  mat.position.copy(AC).setY(0.01); mat.receiveShadow = true; scene.add(mat);
  const grid = new THREE.GridHelper(ARENA, 12, 0x4a7ab8, 0x34506f); grid.position.copy(AC).setY(0.022); scene.add(grid);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xffb020, emissive: 0x553300 });
  for (const [x, z, w, d] of [[0, -ARENA / 2, ARENA + .1, .05], [0, ARENA / 2, ARENA + .1, .05], [-ARENA / 2, 0, .05, ARENA], [ARENA / 2, 0, .05, ARENA]]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, d), wallMat); wall.position.set(AC.x + x, 0.04, AC.z + z); scene.add(wall);
  }
  // lab: dinding belakang dekoratif
  for (let i = -5; i <= 5; i++) {
    const h = 2 + (i * 7919 % 5) * .3;
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, h, .4), new THREE.MeshStandardMaterial({ color: 0x1b2638 }));
    b.position.set(i * 1.5, h / 2, -8); scene.add(b);
    const strip = new THREE.Mesh(new THREE.BoxGeometry(1.2, .04, .02), new THREE.MeshBasicMaterial({ color: i % 2 ? 0x33ddff : 0xffb020 }));
    strip.position.set(i * 1.5, h - .2, -7.79); scene.add(strip);
  }
}

// ---------- Panel teks ----------
function makePanel(w, h, cw, ch) {
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  return { mesh, ctx, tex, c };
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrap(ctx, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; } else line = t; }
  if (line) ctx.fillText(line, x, y); return y;
}

const header = makePanel(2.6, 0.42, 1300, 210);
header.mesh.position.set(0, 2.55, -4.4); header.mesh.lookAt(0, 1.6, 0); scene.add(header.mesh);
{ const { ctx, c } = header; glass(ctx, c.width, c.height, 'rgba(255,176,32,.9)', 36);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = `bold 78px ${FONT}`; ctx.fillText(tr('ROBOT RODA MECANUM', 'MECANUM WHEEL ROBOT'), c.width / 2, 80);
  ctx.fillStyle = '#ffcf70'; ctx.font = `42px ${FONT}`; ctx.fillText(HEADER, c.width / 2, 155); header.tex.needsUpdate = true; }

const info = makePanel(1.1, 1.25, 880, 1000);
info.mesh.position.set(1.45, 1.45, -1.3); info.mesh.lookAt(0, 1.5, 0); scene.add(info.mesh);

// ---------- Robot ----------
const robot = new THREE.Group(); robot.position.copy(AC); scene.add(robot);
const L = 0.62, W = 0.5, WR = 0.075; // panjang, lebar, jari-jari roda
{
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(W - 0.12, 0.08, L), new THREE.MeshStandardMaterial({ color: 0x2a6df4, metalness: .4, roughness: .4 }));
  chassis.position.y = WR + 0.03; chassis.castShadow = true; robot.add(chassis);
  const top = new THREE.Mesh(new THREE.BoxGeometry(W - 0.2, 0.012, L - 0.12), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: .2 }));
  top.position.y = WR + 0.076; robot.add(top);
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 0.08), new THREE.MeshStandardMaterial({ color: 0x0c7a3a }));
  board.position.set(0, WR + 0.09, 0.05); robot.add(board);
  const lidar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.05, 24), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: .6 }));
  lidar.position.set(0, WR + 0.12, -0.1); robot.add(lidar); robot.userData.lidar = lidar;
  const front = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.1, 3), new THREE.MeshBasicMaterial({ color: 0xffb020 }));
  front.rotation.x = -Math.PI / 2; front.position.set(0, WR + 0.09, -L / 2 + 0.02); robot.add(front);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x66ffff });
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), eyeM); e.position.set(s * 0.1, WR + 0.03, -L / 2 - 0.002); robot.add(e); }
}
// Roda: urutan FL, FR, RL, RR. Arah gaya roller (sumbu robot: x=depan, y=kiri)
const WHEELS = [
  { name: tr('Kiri-Depan', 'Front-Left'),    key: 'FL', x: -1, z: -1, roller: [1, -1] },
  { name: tr('Kanan-Depan', 'Front-Right'),   key: 'FR', x:  1, z: -1, roller: [1,  1] },
  { name: tr('Kiri-Belakang', 'Rear-Left'), key: 'RL', x: -1, z:  1, roller: [1,  1] },
  { name: tr('Kanan-Belakang', 'Rear-Right'),key: 'RR', x:  1, z:  1, roller: [1, -1] },
];
const rollerMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: .6 });
const hubMat = new THREE.MeshStandardMaterial({ color: 0xffb020, metalness: .5, roughness: .3 });
for (const w of WHEELS) {
  const g = new THREE.Group(); g.position.set(w.x * (W / 2), WR, w.z * (L / 2 - 0.09)); robot.add(g);
  const spin = new THREE.Group(); g.add(spin);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(WR * .55, WR * .55, 0.06, 20), hubMat);
  hub.rotation.z = Math.PI / 2; spin.add(hub);
  // roller miring 45° (pola X dilihat dari atas)
  const sign = w.roller[0] * w.roller[1]; // +1 atau -1
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2;
    const rl = new THREE.Mesh(new THREE.CapsuleGeometry(0.016, 0.05, 4, 8), rollerMat);
    const holder = new THREE.Group(); holder.rotation.x = a; spin.add(holder);
    rl.position.y = WR - 0.016; rl.rotation.z = Math.PI / 2; rl.rotation.y = sign * Math.PI / 4;
    rl.castShadow = true; holder.add(rl);
  }
  // panah gaya
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0.22, 0), 0.3, 0x33ff88, 0.08, 0.06);
  g.add(arrow);
  w.group = g; w.spin = spin; w.arrow = arrow; w.speed = 0;
}
const netArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0.32, 0), 0.5, 0xffcc33, 0.12, 0.09);
robot.add(netArrow);
const rotRing = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.012, 6, 48, Math.PI * 1.5), new THREE.MeshBasicMaterial({ color: 0xff66ff }));
rotRing.rotation.x = Math.PI / 2; rotRing.position.y = 0.3; robot.add(rotRing);

// jejak lintasan
const TRAIL = 600, trailPos = new Float32Array(TRAIL * 3); let trailN = 0;
const trailGeo = new THREE.BufferGeometry(); trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3)); trailGeo.setDrawRange(0, 0);
scene.add(new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x33ddff, transparent: true, opacity: .7 })));
function pushTrail(p) {
  if (trailN === TRAIL) { trailPos.copyWithin(0, 3); trailN--; }
  trailPos[trailN * 3] = p.x; trailPos[trailN * 3 + 1] = 0.03; trailPos[trailN * 3 + 2] = p.z; trailN++;
  trailGeo.attributes.position.needsUpdate = true; trailGeo.setDrawRange(0, trailN);
}

// ---------- Misi bintang ----------
const starShape = new THREE.Shape();
for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 0.05 : 0.12;
  i ? starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : starShape.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.03, bevelEnabled: false }); starGeo.center();
const starMat = new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0xffaa00, emissiveIntensity: .6, metalness: .5 });
const stars = []; let collected = 0, rounds = 0, missionT = 0;
function placeStars() {
  for (const s of stars) scene.remove(s); stars.length = 0;
  for (let i = 0; i < STARS; i++) {
    const s = new THREE.Mesh(starGeo, starMat);
    let p; do { p = new THREE.Vector3(AC.x + R.randFloat(-1.4, 1.4), 0.25, AC.z + R.randFloat(-1.4, 1.4)); }
    while (p.distanceTo(robot.position.clone().setY(.25)) < 0.6 || stars.some(o => o.position.distanceTo(p) < 0.5));
    s.position.copy(p); s.castShadow = true; scene.add(s); stars.push(s);
  }
  collected = 0; missionT = 0;
}
placeStars();

// ---------- Suara ----------
let ac = null, motor = null, motorGain = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)();
    motor = ac.createOscillator(); motor.type = 'sawtooth'; motor.frequency.value = 60;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
    motorGain = ac.createGain(); motorGain.gain.value = 0; motor.connect(f).connect(motorGain).connect(ac.destination); motor.start(); } catch (e) {} }
  ac?.resume?.();
}
function tone(f, d, type = 'sine', vol = .2) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
addEventListener('pointerdown', initAudio); addEventListener('click', initAudio, true);
renderer.xr.addEventListener('sessionstart', initAudio);

// ---------- Mode gerak ----------
const MODES = {
  stop:   { t: tr('Berhenti', 'Stop'), vx: 0, vy: 0, w: 0, d: tr('Pilih tombol arah, atau pakai joystick controller: stik KIRI = gerak, stik KANAN = putar.', 'Pick a direction button, or use the controller joysticks: LEFT stick = move, RIGHT stick = rotate.') },
  fwd:    { t: tr('Maju', 'Forward'), vx: 1, vy: 0, w: 0, d: tr('Keempat roda berputar ke depan. Gaya miring dari roller kiri dan kanan saling menjumlah menjadi gaya lurus ke depan.', 'All four wheels spin forward. The angled forces from the left and right rollers add up to a straight forward force.') },
  back:   { t: tr('Mundur', 'Backward'), vx: -1, vy: 0, w: 0, d: tr('Keempat roda berputar ke belakang. Sama seperti maju, hanya arahnya dibalik.', 'All four wheels spin backward. Same as forward, just reversed.') },
  left:   { t: tr('Geser Kiri', 'Slide Left'), vx: 0, vy: 1, w: 0, d: tr('Inilah keajaiban mecanum! Roda Kiri-Depan & Kanan-Belakang mundur, dua lainnya maju. Komponen depan-belakang saling meniadakan, tersisa gaya ke samping.', 'This is the mecanum magic! Front-Left & Rear-Right spin backward, the other two forward. The front-back components cancel out, leaving a sideways force.') },
  right:  { t: tr('Geser Kanan', 'Slide Right'), vx: 0, vy: -1, w: 0, d: tr('Kebalikan geser kiri. Robot bergerak menyamping tanpa berbelok - mobil biasa tidak bisa melakukan ini!', 'The opposite of slide left. The robot moves sideways without turning - a normal car can\'t do this!') },
  fl:     { t: tr('Diagonal Kiri-Depan', 'Diagonal Front-Left'), vx: .71, vy: .71, w: 0, d: tr('Cukup DUA roda yang berputar (Kanan-Depan & Kiri-Belakang). Dua roda lain diam.', 'Only TWO wheels spin (Front-Right & Rear-Left). The other two stay still.') },
  fr:     { t: tr('Diagonal Kanan-Depan', 'Diagonal Front-Right'), vx: .71, vy: -.71, w: 0, d: tr('Hanya roda Kiri-Depan & Kanan-Belakang yang berputar. Perhatikan panah gayanya sejajar arah gerak.', 'Only Front-Left & Rear-Right spin. Notice their force arrows line up with the direction of motion.') },
  bl:     { t: tr('Diagonal Kiri-Belakang', 'Diagonal Rear-Left'), vx: -.71, vy: .71, w: 0, d: tr('Dua roda berputar mundur, dua lainnya diam.', 'Two wheels spin backward, the other two stay still.') },
  br:     { t: tr('Diagonal Kanan-Belakang', 'Diagonal Rear-Right'), vx: -.71, vy: -.71, w: 0, d: tr('Dua roda berputar mundur, dua lainnya diam.', 'Two wheels spin backward, the other two stay still.') },
  ccw:    { t: tr('Putar Kiri', 'Rotate Left'), vx: 0, vy: 0, w: 1, d: tr('Roda kanan maju, roda kiri mundur. Robot berputar di tempat seperti tank.', 'Right wheels forward, left wheels backward. The robot spins in place like a tank.') },
  cw:     { t: tr('Putar Kanan', 'Rotate Right'), vx: 0, vy: 0, w: -1, d: tr('Roda kiri maju, roda kanan mundur. Robot berputar searah jarum jam.', 'Left wheels forward, right wheels backward. The robot spins clockwise.') },
  orbit:  { t: tr('Geser + Putar', 'Slide + Rotate'), vx: 0, vy: 1, w: -.8, d: tr('Gabungan geser kiri dan putar kanan sekaligus: robot mengitari sebuah titik. Ini disebut gerak holonomic.', 'Slide left and rotate right at the same time: the robot circles around a point. This is called holonomic motion.') },
};
const JOY_DESC = tr('Mode joystick: maju, geser, dan putar bisa digabung bebas. Komputer di robot menghitung kecepatan tiap roda dengan rumus kinematika di bawah.', 'Joystick mode: forward, slide and rotate can be combined freely. The robot\'s computer works out each wheel\'s speed with the kinematics formula below.');
let mode = 'stop', fieldCentric = false, joyActive = false;
const cmd = { vx: 0, vy: 0, w: 0 };

// ---------- Panel tombol ----------
const panel = new THREE.Group(); panel.position.set(-0.62, 1.0, -0.5); panel.rotation.set(-0.7, 0.75, 0, 'YXZ'); scene.add(panel);
const panelBg = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.5, 0.015), new THREE.MeshStandardMaterial({ color: 0x1a2436, metalness: .3 }));
panelBg.position.set(0, 0, -0.01); panel.add(panelBg);
const buttons = [];
function makeButton(label, x, y, action, color = 0x2f4a73, w = 0.11, h = 0.1, fs = 72) {
  const c = document.createElement('canvas'); c.width = Math.round(w * 2200); c.height = Math.round(h * 2200);
  const ctx = c.getContext('2d');

const S = 0.12;
const grid = [['fl', '↖'], ['fwd', '↑'], ['fr', '↗'], ['left', '←'], ['stop', '■'], ['right', '→'], ['bl', '↙'], ['back', '↓'], ['br', '↘']];
grid.forEach(([m, l], i) => makeButton(l, -0.17 + (i % 3) * S, 0.15 - Math.floor(i / 3) * S, () => setMode(m), m === 'stop' ? 0x8a2433 : 0x2f4a73, .11, .1, 110).userData.mode = m);
makeButton(tr('⟲ Putar Kiri', '⟲ Rotate Left'), 0.215, 0.15, () => setMode('ccw'), 0x5a2f73, .15, .1, 54).userData.mode = 'ccw';
makeButton(tr('⟳ Putar Kanan', '⟳ Rotate Right'), 0.215, 0.03, () => setMode('cw'), 0x5a2f73, .15, .1, 54).userData.mode = 'cw';
makeButton(tr('Geser + Putar', 'Slide + Rotate'), 0.215, -0.09, () => setMode('orbit'), 0x5a2f73, .15, .1, 54).userData.mode = 'orbit';
const fcBtn = makeButton(tr('Kendali: ROBOT', 'Control: ROBOT'), -0.15, -0.205, () => toggleField(), 0x2f6b4a, .2, .06, 52);
makeButton(tr('Reset posisi', 'Reset position'), 0.06, -0.205, () => resetRobot(), 0x6b5a2f, .17, .06, 50);
makeButton(tr('✕ Keluar', '✕ Exit'), 0.225, -0.205, () => { try { renderer.xr.getSession()?.end(); } catch (e) {} }, 0x8a2433, .13, .06, 50);
function setMode(m) { mode = m; joyActive = false; tone(m === 'stop' ? 330 : 660, .08, 'square', .1); lastInfo = ''; }
function toggleField() {

  const ctx = fcBtn.children[0].material.map.image.getContext('2d'), c = ctx.canvas;
  ctx.clearRect(0, 0, c.width, c.height);
  { const g = ctx.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(.5, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(0,0,0,.15)');
    ctx.fillStyle = g; rr(ctx, 4, 4, c.width - 8, c.height - 8, c.height * .22); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4; rr(ctx, 4, 4, c.width - 8, c.height - 8, c.height * .22); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.font = `bold 52px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(fieldCentric ? tr('Kendali: LAPANGAN', 'Control: FIELD') : tr('Kendali: ROBOT', 'Control: ROBOT'), c.width / 2, c.height / 2 + 4); fcBtn.children[0].material.map.needsUpdate = true;
  lastInfo = '';
}
function resetRobot() { robot.position.copy(AC); robot.rotation.y = 0; mode = 'stop'; trailN = 0; trailGeo.setDrawRange(0, 0); tone(440, .1); lastInfo = ''; }

// ---------- Controller / tangan ----------
const ray = new THREE.Raycaster();
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i); scene.add(c);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .5 }));
  line.scale.z = 3; c.add(line);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffff66 }));
  dot.visible = false; scene.add(dot);
  const o = { c, line, dot, source: null, hover: null };
  c.addEventListener('connected', e => { o.source = e.data; });
  c.addEventListener('disconnected', () => { o.source = null; });
  c.addEventListener('selectstart', () => { initAudio(); if (o.hover) { press(o.hover); haptic(o, .6, 40); } });
  return o;

function haptic(o, s, ms) { try { o?.source?.gamepad?.hapticActuators?.[0]?.pulse(s, ms); } catch (e) {} }
function press(btn) { btn.userData.action(); btn.userData.pressT = .15; }
const tmpM = new THREE.Matrix4();
function updatePointers() {
  for (const b of buttons) b.material.emissive.setHex(!joyActive && b.userData.mode === mode ? 0x2a6a20 : 0x000000);
  for (const o of ctrls) {
    o.hover = null; o.dot.visible = false;
    if (!o.source) continue;
    tmpM.identity().extractRotation(o.c.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(o.c.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
    const hit = ray.intersectObjects(buttons, false)[0];
    if (hit) { o.hover = hit.object; hit.object.material.emissive.setHex(0x335577); o.line.scale.z = hit.distance; o.dot.position.copy(hit.point); o.dot.visible = true; }

}
// mode tes laptop
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', ev => {
  if (renderer.xr.isPresenting) return;
  mouse.set(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera); const hit = ray.intersectObjects(buttons, false)[0]; if (hit) press(hit.object);
});
// keyboard tes laptop: WASD + Q/E
const keys = {}; addEventListener('keydown', e => keys[e.key.toLowerCase()] = true); addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function readJoystick() {
  let mx = 0, my = 0, rx = 0;
  for (const o of ctrls) {
    const gp = o.source?.gamepad; if (!gp || !gp.axes) continue;
    const x = gp.axes.length >= 4 ? gp.axes[2] : gp.axes[0] || 0, y = gp.axes.length >= 4 ? gp.axes[3] : gp.axes[1] || 0;
    if (o.source.handedness === 'right') rx = x; else { mx = x; my = y; }
  }
  if (!renderer.xr.isPresenting) { mx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0); my = (keys.s ? 1 : 0) - (keys.w ? 1 : 0); rx = (keys.e ? 1 : 0) - (keys.q ? 1 : 0); }
  const dz = v => Math.abs(v) < 0.15 ? 0 : v;

}

// ---------- Info panel ----------
let lastInfo = '';
function drawInfo(ws) {
  const title = joyActive ? 'Joystick' : MODES[mode].t;
  const keyS = [title, fieldCentric, collected, rounds, ...ws.map(v => Math.round(v * 20))].join('|');
  if (keyS === lastInfo) return; lastInfo = keyS;
  const { ctx, c } = info, Wd = c.width; ctx.clearRect(0, 0, Wd, c.height);
  glass(ctx, Wd, c.height, 'rgba(80,220,255,.9)', 36);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#9fd8ff'; ctx.font = `34px ${FONT}`; ctx.fillText(tr('GERAKAN SEKARANG', 'CURRENT MOTION'), 44, 70);
  ctx.fillStyle = '#fff'; ctx.font = `bold 64px ${FONT}`; ctx.fillText(title, 44, 140);
  ctx.fillStyle = '#d8e6ff'; ctx.font = `32px ${FONT}`;
  let y = wrap(ctx, joyActive ? JOY_DESC : MODES[mode].d, 44, 195, Wd - 88, 42);
  if (fieldCentric) { ctx.fillStyle = '#7dffa0'; y = wrap(ctx, tr('Kendali LAPANGAN: software memutar perintah joystick sesuai arah hadap robot, jadi "atas" selalu menjauhi kamu.', 'FIELD control: the software rotates the joystick command by the robot\'s heading, so "up" always means away from you.'), 44, y + 50, Wd - 88, 40); }
  // grafik kecepatan roda

  ctx.fillStyle = '#9fd8ff'; ctx.font = `32px ${FONT}`; ctx.fillText(tr('KECEPATAN TIAP RODA', 'SPEED OF EACH WHEEL'), 44, y);

    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(cx - bw, yy + 8, bw * 2, 36);
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 2, yy + 2, 4, 48);

  ctx.fillStyle = '#ffcf70'; ctx.font = '27px ui-monospace, monospace';
  ctx.fillText('KD=vx-vy-kω  KnD=vx+vy+kω', 44, y + 365); ctx.fillText('KB=vx+vy-kω  KnB=vx-vy+kω', 44, y + 400);
  ctx.fillStyle = '#ffd23f'; ctx.font = `bold 38px ${FONT}`;

  info.tex.needsUpdate = true;
}

// ---------- Loop ----------
const clock = new THREE.Clock(); let now = 0, trailT = 0, prevVals = [0, 0, 0, 0];
const up = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3(), K = (L + W) / 2;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); now += dt;

  const vals = raw.map(v => R.clamp(v / norm, -1, 1));

  WHEELS.forEach((w, i) => {
    w.spin.rotation.x -= raw[i] / WR * dt;

  else netArrow.visible = false;

  robot.position.z = R.clamp(robot.position.z, AC.z - lim, AC.z + lim);
  robot.userData.lidar.rotation.y += dt * 6;
  trailT += dt; if (trailT > 0.05 && sp + Math.abs(cmd.w) > 0.02) { trailT = 0; pushTrail(robot.position); }

  // bintang

  for (const s of [...stars]) {
    s.rotation.y += dt * 2; s.position.y = 0.25 + Math.sin(now * 3 + s.position.x * 5) * 0.03;
    if (Math.hypot(s.position.x - robot.position.x, s.position.z - robot.position.z) < 0.32) {
      scene.remove(s); stars.splice(stars.indexOf(s), 1); collected++; popup(s.position.clone().add(new THREE.Vector3(0, .25, 0)), `★ ${collected}/${STARS}`, '#ffd23f', .45); tone(1200, .15, 'triangle', .2); setTimeout(() => tone(1600, .2, 'triangle', .2), 90);
