<!DOCTYPE html>
<html lang="id">

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--a1:#33ddff;--a2:#2a6df4;--a3:rgba(51,221,255,.4)}
  body{font-family:'Space Grotesk',system-ui,sans-serif!important}
  .nav{position:fixed;top:16px;left:16px;z-index:5;padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;text-decoration:none;font-weight:600}
  #info{top:auto!important;left:50%!important;right:auto!important;bottom:96px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));
    padding:20px 24px;border-radius:24px;opacity:1!important;font-size:15px!important;color:#d6dbf2;
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);

  #info b:first-child{display:block;font-size:26px;color:#fff;margin-bottom:6px}

  #ov{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:5;width:min(560px,calc(100% - 32px));padding:26px 28px;border-radius:26px;

<body>
<script src="loader.js"></script>
<a class="nav" href="./">← Menu</a>
<div id="ov">
  <span class="tag">Pemula · Kini dengan Mixed Reality</span>
  <h1>Pop Bola</h1>
  <p>Bola bermunculan di sekitarmu. Pecahkan dengan ujung jari atau controller. Biru +1, emas +5, merah −3. Mode Mixed Reality membuat bola muncul di ruangan nyatamu!</p>
  <div class="btns"><button class="btn primary" id="btnAR" disabled>Mulai Mixed Reality</button><button class="btn" id="btnVR" disabled>Mulai VR</button></div>
  <div id="msg">Memeriksa perangkat…</div>
</div>
<script type="module">
import * as THREE from 'three';

// ====== PENGATURAN (silakan ubah) ======
const EVENT_NAME = 'Pameran Kampus UVERS';
const DURATION   = 60;          // detik per ronde
const TYPES = {
  normal: { color: 0x33ddff, pts:  1, r: 0.070 },
  gold:   { color: 0xffcc33, pts:  5, r: 0.050 },
  bomb:   { color: 0xff3344, pts: -3, r: 0.075 },
};
// =======================================

// ---------- Gaya visual bersama (font, panel kaca, angka melayang) ----------
await Promise.race([document.fonts.load("700 40px 'Space Grotesk'"), new Promise(r => setTimeout(r, 1500))]).catch(() => {});
const FONT = "'Space Grotesk', system-ui, sans-serif";
function glass(ctx, W, H, accent, rad = 40) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(38,34,78,.82)'); g.addColorStop(1, 'rgba(8,12,30,.82)');
  ctx.fillStyle = g; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.fill();
  ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 24; ctx.strokeStyle = accent; ctx.lineWidth = 5; rr(ctx, 6, 6, W - 12, H - 12, rad); ctx.stroke(); ctx.restore();
  const hl = ctx.createLinearGradient(0, 0, 0, H * .45); hl.addColorStop(0, 'rgba(255,255,255,.14)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; rr(ctx, 14, 14, W - 28, H * .42, Math.max(8, rad - 8)); ctx.fill();
}
const __pops = [];
function popup(pos, text, color = '#ffffff', size = .3) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const x = c.getContext('2d');
  x.font = `700 84px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 10; x.strokeStyle = 'rgba(0,0,0,.55)'; x.strokeText(text, 256, 64); x.fillStyle = color; x.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.position.copy(pos); s.scale.set(size, size / 4, 1); s.renderOrder = 998; scene.add(s); __pops.push({ s, tex, t0: performance.now() });
}
function updatePopups() {
  const now = performance.now();
  for (let i = __pops.length - 1; i >= 0; i--) { const p = __pops[i], k = (now - p.t0) / 900;
    p.s.position.y += 0.004; p.s.material.opacity = Math.max(0, 1 - k * k);
    if (k >= 1) { scene.remove(p.s); p.tex.dispose(); p.s.material.dispose(); __pops.splice(i, 1); } }
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 6, 22);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.03, 60);
camera.position.set(0, 1.6, 1.1);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Lingkungan ----------
scene.add(new THREE.HemisphereLight(0x99bbff, 0x223344, 1.3));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(2, 4, 1); scene.add(dl);
const env = new THREE.Group(); scene.add(env);
env.add(new THREE.GridHelper(30, 60, 0x3355aa, 0x1a2a55));
const ring = new THREE.Mesh(new THREE.RingGeometry(0.85, 0.95, 64),
  new THREE.MeshBasicMaterial({ color: 0x44ccff, transparent: true, opacity: .5, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; scene.add(ring);
{ // bintang
  const n = 800, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(25);
    v.y = Math.abs(v.y) + 2; v.toArray(p, i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  env.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.08, fog: false })));
}
// pilar dekorasi
for (let i = 0; i < 10; i++) {
  const a = (i + 0.5) / 10 * Math.PI * 2, h = 1 + Math.random() * 3;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, h, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x1b2a55, emissive: 0x0a1a44 }));
  m.position.set(Math.sin(a) * 7, h / 2, Math.cos(a) * 7); env.add(m);
}

// ---------- Panel teks (canvas) ----------
function makePanel(w, h, cw, ch) {
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  return { mesh, ctx, tex, c };
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

const board = makePanel(1.4, 0.7, 1024, 512);
board.mesh.position.set(0, 2.0, -1.7); scene.add(board.mesh);

const label = makePanel(0.4, 0.1, 512, 128);
label.mesh.position.set(0, 1.42, -0.45); scene.add(label.mesh);
{ const { ctx, c } = label; ctx.clearRect(0, 0, c.width, c.height);
  glass(ctx, c.width, c.height, 'rgba(125,255,160,.85)', 30);
  ctx.fillStyle = '#7dffa0'; ctx.font = `bold 42px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SENTUH UNTUK MULAI', 256, 66); label.tex.needsUpdate = true; }

const startBtn = new THREE.Mesh(new THREE.SphereGeometry(0.08, 32, 16),
  new THREE.MeshStandardMaterial({ color: 0x33ff77, emissive: 0x118833 }));
startBtn.position.set(0, 1.25, -0.45); scene.add(startBtn);

// ---------- Tombol KELUAR (sentuh untuk keluar) ----------
const exitBtn = new THREE.Mesh(new THREE.SphereGeometry(0.05, 24, 12), new THREE.MeshStandardMaterial({ color: 0xff4466, emissive: 0x881122 }));
exitBtn.position.set(0.3, 1.2, -0.5); scene.add(exitBtn);
const exitLabel = makePanel(0.2, 0.06, 320, 96); exitLabel.mesh.position.set(0.3, 1.3, -0.5); scene.add(exitLabel.mesh);
{ const { ctx, c } = exitLabel; glass(ctx, c.width, c.height, 'rgba(255,90,120,.9)', 26);
  ctx.fillStyle = '#fff'; ctx.font = `700 46px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('KELUAR', c.width / 2, c.height / 2 + 3); exitLabel.tex.needsUpdate = true; }
function exitXR() { try { renderer.xr.getSession()?.end(); } catch (e) {} }

// ---------- State game ----------
let state = 'idle', score = 0, elapsed = 0, spawnT = 0, canStart = true, newRecord = false;
let best = 0; try { best = +localStorage.getItem('popvr_best') || 0; } catch (e) {}
let lastDrawKey = '';

function drawBoard() {
  const remain = Math.max(0, Math.ceil(DURATION - elapsed));
  const key = state + score + '|' + remain + '|' + best;
  if (key === lastDrawKey) return; lastDrawKey = key;
  const { ctx, c } = board; ctx.clearRect(0, 0, c.width, c.height);
  glass(ctx, c.width, c.height, 'rgba(80,220,255,.9)');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#9fd8ff'; ctx.font = `32px ${FONT}`; ctx.fillText(EVENT_NAME, 512, 50);
  if (state === 'playing') {
    ctx.fillStyle = '#fff'; ctx.font = `bold 150px ${FONT}`; ctx.fillText(score, 512, 210);
    ctx.font = `44px ${FONT}`; ctx.fillStyle = '#9fd8ff'; ctx.fillText('SKOR', 512, 110);
    ctx.fillStyle = remain <= 5 ? '#ff6677' : '#7dffa0'; ctx.font = `bold 80px ${FONT}`;
    ctx.fillText('⏱ ' + remain + ' s', 512, 370);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(112, 440, 800, 24);
    ctx.fillStyle = remain <= 5 ? '#ff6677' : '#44ccff'; ctx.fillRect(112, 440, 800 * remain / DURATION, 24);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = `bold 92px ${FONT}`;
    ctx.fillText(state === 'over' ? 'Skor: ' + score : 'POP BOLA VR', 512, 140);
    ctx.font = `40px ${FONT}`;
    if (state === 'over' && newRecord) { ctx.fillStyle = '#ffcc33'; ctx.fillText('★ REKOR BARU! ★', 512, 225); }
    else { ctx.fillStyle = '#9fd8ff'; ctx.fillText('Rekor hari ini: ' + best, 512, 225); }
    ctx.font = `36px ${FONT}`;
    ctx.fillStyle = '#33ddff'; ctx.fillText('● Biru +1', 230, 310);
    ctx.fillStyle = '#ffcc33'; ctx.fillText('◆ Emas +5', 512, 310);
    ctx.fillStyle = '#ff5566'; ctx.fillText('✸ Merah −3', 800, 310);
    ctx.fillStyle = '#fff'; ctx.font = `38px ${FONT}`;
    ctx.fillText('Sentuh bola dengan tangan / controller', 512, 390);
    ctx.fillStyle = '#7dffa0'; ctx.fillText('Sentuh tombol hijau untuk ' + (state === 'over' ? 'main lagi' : 'mulai'), 512, 450);
  }
  board.tex.needsUpdate = true;
}

// ---------- Suara (disintesis, tanpa file) ----------
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } ac?.resume?.(); }
function beep(f, d = 0.12, type = 'sine', vol = 0.25, ramp = 1.6) {
  if (!ac) return; const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * ramp, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}
addEventListener('pointerdown', initAudio); addEventListener('click', initAudio, true);
renderer.xr.addEventListener('sessionstart', initAudio);

// ---------- Tangan / controller ----------
const tips = [0, 1].map(i => {
  const ctrl = renderer.xr.getController(i); scene.add(ctrl);
  const hand = renderer.xr.getHand(i); scene.add(hand);
  const vis = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12),
    new THREE.MeshBasicMaterial({ color: i ? 0xff88ff : 0x88ffff }));
  vis.visible = false; scene.add(vis);
  const o = { ctrl, hand, vis, source: null, pos: new THREE.Vector3(), active: false };
  ctrl.addEventListener('connected', e => { o.source = e.data; });
  ctrl.addEventListener('disconnected', () => { o.source = null; o.active = false; });
  return o;
});
function updateTips() {
  for (const o of tips) {
    o.active = false;
    if (!o.source) { o.vis.visible = false; continue; }
    if (o.source.hand) {
      const j = o.hand.joints && o.hand.joints['index-finger-tip'];
      if (j && j.visible) { j.getWorldPosition(o.pos); o.active = true; }
    } else if (o.ctrl.visible) { o.ctrl.getWorldPosition(o.pos); o.active = true; }
    o.vis.visible = o.active; if (o.active) o.vis.position.copy(o.pos);
  }
}
function haptic(o, s = 0.7, ms = 40) { try { o?.source?.gamepad?.hapticActuators?.[0]?.pulse(s, ms); } catch (e) {} }

// ---------- Target ----------
const GEO = { normal: new THREE.SphereGeometry(1, 24, 16), gold: new THREE.OctahedronGeometry(1, 0), bomb: new THREE.IcosahedronGeometry(1, 0) };
const MAT = {};
for (const k in TYPES) MAT[k] = new THREE.MeshStandardMaterial({ color: TYPES[k].color, emissive: TYPES[k].color, emissiveIntensity: .45, roughness: .3, flatShading: k !== 'normal' });
const targets = [];
const head = new THREE.Vector3();
const R = THREE.MathUtils;

function spawn() {
  const prog = elapsed / DURATION, r = Math.random();
  let type = 'normal';
  if (elapsed > 8 && r < 0.15 + 0.1 * prog) type = 'bomb'; else if (r > 0.88) type = 'gold';
  const a = R.degToRad(R.randFloat(-65, 65)), d = R.randFloat(0.4, 0.7);
  const y = Math.max(0.6, head.y + R.randFloat(-0.6, 0.1));
  const m = new THREE.Mesh(GEO[type], MAT[type]);
  m.position.set(head.x + Math.sin(a) * d, y, head.z - Math.cos(a) * d);
  m.userData = { type, age: 0, life: R.lerp(2.8, 1.5, prog), r: TYPES[type].r };
  m.scale.setScalar(0.001); scene.add(m); targets.push(m);
}
function removeTarget(i) { scene.remove(targets[i]); targets.splice(i, 1); }

// ---------- Partikel ----------
const parts = [], pGeo = new THREE.SphereGeometry(0.012, 6, 4);
function burst(pos, color, n = 14) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(pGeo, mat); p.position.copy(pos);
    p.userData = { v: new THREE.Vector3().randomDirection().multiplyScalar(R.randFloat(0.6, 1.6)), t: 0 };
    scene.add(p); parts.push(p);
  }
  const f = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
  f.position.copy(pos); f.scale.setScalar(.03); f.userData = { v: new THREE.Vector3(), t: 0, flash: true }; scene.add(f); parts.push(f);
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], u = p.userData; u.t += dt;
    if (u.flash) { p.scale.setScalar(.03 + u.t * .5); } else { u.v.y -= 2.5 * dt; p.position.addScaledVector(u.v, dt); }
    p.material.opacity = Math.max(0, 1 - u.t / 0.6);
    if (u.t > 0.6) { scene.remove(p); parts.splice(i, 1); }
  }
}

// ---------- Alur game ----------
function startGame() {
  state = 'playing'; score = 0; elapsed = 0; spawnT = 0.3; newRecord = false; canStart = false;
  startBtn.visible = label.mesh.visible = false;
  while (targets.length) removeTarget(0);
  beep(440, .1); setTimeout(() => beep(660, .1), 110); setTimeout(() => beep(880, .18), 220);
}
function endGame() {
  state = 'over'; while (targets.length) removeTarget(0);
  if (score > best) { best = score; newRecord = true; try { localStorage.setItem('popvr_best', best); } catch (e) {} }
  beep(880, .15); setTimeout(() => beep(660, .15), 160); setTimeout(() => beep(440, .4, 'triangle'), 320);
  setTimeout(() => { canStart = true; startBtn.visible = label.mesh.visible = true; }, 2000);
}
function hitTarget(i, o) {
  const m = targets[i], t = TYPES[m.userData.type];
  score = Math.max(0, score + t.pts); burst(m.position, t.color);
  popup(m.position.clone().add(new THREE.Vector3(0, .08, 0)), (t.pts > 0 ? '+' : '') + t.pts, t.pts < 0 ? '#ff6677' : t.pts > 1 ? '#ffe27a' : '#9ff0ff', t.pts > 1 ? .32 : .24);
  if (m.userData.type === 'bomb') { beep(160, .3, 'sawtooth', .3, 0.4); haptic(o, 1, 150); }
  else if (m.userData.type === 'gold') { beep(1200, .2, 'triangle'); haptic(o, .9, 60); }
  else { beep(R.randFloat(500, 700), .1); haptic(o, .6, 30); }
  removeTarget(i);
}

// mode tes laptop: klik
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  if (renderer.xr.isPresenting) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  if (canStart && state !== 'playing' && ray.intersectObject(startBtn).length) return startGame();
  const hits = ray.intersectObjects(targets);
  if (hits.length) hitTarget(targets.indexOf(hits[0].object), null);
});
renderer.xr.addEventListener('sessionend', () => { if (state === 'playing') endGame(); });

// ---------- Loop ----------
const clock = new THREE.Clock(); let tickShown = -1, now = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); now += dt;
  camera.getWorldPosition(head);
  updateTips();

  if (state === 'playing') {
    elapsed += dt;
    const remain = Math.ceil(DURATION - elapsed);
    if (remain <= 5 && remain > 0 && remain !== tickShown) { tickShown = remain; beep(1000, .05, 'square', .12, 1); }
    spawnT -= dt;
    if (spawnT <= 0 && targets.length < 6) { spawn(); spawnT = R.lerp(0.9, 0.42, elapsed / DURATION); }
    if (elapsed >= DURATION) endGame();
  }

  for (let i = targets.length - 1; i >= 0; i--) {
    const m = targets[i], u = m.userData; u.age += dt;
    const s = Math.min(1, u.age / 0.15) * u.r; m.scale.setScalar(s);
    m.rotation.y += dt * 1.5; m.position.y += Math.sin(now * 3 + i) * 0.0008;
    m.visible = !(u.life - u.age < 0.5 && Math.floor(now * 12) % 2);
    if (u.age > u.life) { removeTarget(i); continue; }
    for (const o of tips) {
      if (o.active && o.pos.distanceTo(m.position) < u.r + 0.035) { hitTarget(i, o); break; }
    }
  }

  exitBtn.visible = exitLabel.mesh.visible = startBtn.visible && renderer.xr.isPresenting;
  if (exitBtn.visible) for (const o of tips) if (o.active && o.pos.distanceTo(exitBtn.position) < 0.08) { exitXR(); break; }
  if (startBtn.visible) {
    startBtn.scale.setScalar(1 + Math.sin(now * 4) * 0.08);
    for (const o of tips) if (canStart && o.active && o.pos.distanceTo(startBtn.position) < 0.11) { startGame(); haptic(o, .8, 60); break; }
  }

  updateParticles(dt);
  drawBoard();
  updatePopups();
  renderer.render(scene, camera);
});

// ---------- Mulai sesi XR (Mixed Reality / VR) ----------
const BGC = new THREE.Color(0x0b1020), FOG = scene.fog;
let xrKind = null;
function applyEnv() { const ar = xrKind === 'ar'; env.visible = !ar; scene.background = ar ? null : BGC; scene.fog = ar ? null : FOG; }
const ov = document.getElementById('ov'), msg = document.getElementById('msg'), btnAR = document.getElementById('btnAR'), btnVR = document.getElementById('btnVR');
(async () => {
  if (!navigator.xr) { msg.textContent = 'WebXR tidak tersedia. Mode tes laptop: klik bola hijau di layar.'; return; }
  const [ar, vr] = await Promise.all([navigator.xr.isSessionSupported('immersive-ar').catch(() => false), navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  btnAR.disabled = !ar; btnVR.disabled = !vr;
  msg.textContent = ar ? 'Siap! Mixed Reality memakai kamera passthrough Quest.' : vr ? 'Mixed Reality tidak tersedia, gunakan mode VR.' : 'Perangkat XR tidak terdeteksi. Mode tes laptop: klik bola hijau di layar.';
})();
async function startXR(kind) {
  initAudio();
  try {
    const s = await navigator.xr.requestSession(kind === 'ar' ? 'immersive-ar' : 'immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
    xrKind = kind; applyEnv();
    s.addEventListener('end', () => { xrKind = null; applyEnv(); ov.classList.remove('hide'); });
    await renderer.xr.setSession(s); ov.classList.add('hide');
  } catch (e) { msg.textContent = 'Gagal memulai: ' + e.message; xrKind = null; applyEnv(); }
}
btnAR.onclick = () => startXR('ar'); btnVR.onclick = () => startXR('vr');
</script>
